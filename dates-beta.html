<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOTME - Profile Swipe Demo</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #161b22;
            --accent-pink: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding-top: 20px;
        }

        /* --- HEADER --- */
        .app-header {
            width: 100%;
            max-width: 400px;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        /* --- SWIPE CONTAINER --- */
        .swipe-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 70vh;
            margin-top: 20px;
            perspective: 1000px;
        }

        /* --- PROFIL KARTE --- */
        .profile-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            user-select: none;
            transition: transform 0.1s ease-out;
            touch-action: none; /* Verhindert Scrolling beim Swipen */
        }

        /* Profilbild Bereich */
        .image-container {
            position: relative;
            width: 100%;
            height: 60%;
            background: linear-gradient(to bottom, transparent 60%, var(--card-bg)),
                        url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600') center/cover;
        }

        /* NOTIERT HERZ */
        .heart-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid var(--accent-pink);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .heart-badge.active {
            background: var(--accent-pink);
        }

        .heart-badge svg {
            width: 30px;
            height: 30px;
            fill: var(--accent-pink);
            transition: fill 0.2s ease;
        }

        .heart-badge.active svg {
            fill: white;
        }

        .heart-badge span {
            font-size: 0.6rem;
            color: var(--accent-pink);
            margin-top: 4px;
            font-weight: bold;
        }

        .heart-badge.active span {
            color: white;
        }

        /* Profil Info */
        .profile-content {
            padding: 0 24px 24px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .name-age {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .location {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .bio {
            font-size: 1rem;
            line-height: 1.4;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        /* Status & Chat Button */
        .bottom-actions {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 8px; height: 8px;
            background-color: #38ef7d;
            border-radius: 50%;
            box-shadow: 0 0 5px #38ef7d;
        }

        .chat-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chat-btn:active {
            transform: scale(0.95);
        }

        /* Info Text */
        .info-hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo">SPOTME</div>
    </div>

    <div class="swipe-container" id="swipeContainer">
        <div class="profile-card" id="profileCard">
            <div class="image-container">
                <div class="heart-badge" id="heartBtn" onclick="toggleNotiert(event)">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span>NOTIERT</span>
                </div>
            </div>

            <div class="profile-content">
                <div class="name-age">Estella, 24</div>
                <div class="location">Gandía, Valencia</div>
                <div class="bio">
                    Suche Fotografen und Studios für Zusammenarbeit im Bereich Fetish Fotografie.
                </div>

                <div class="bottom-actions">
                    <div class="status">gerade aktiv</div>
                    <button class="chat-btn">
                        <span>💬</span> Chat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="info-hint">Karte zum Testen ziehen oder wischen</div>

    <script>
        const card = document.getElementById('profileCard');
        let startX, startY, moveX, moveY;

        // Herz Button Logik
        function toggleNotiert(e) {
            e.stopPropagation(); // Verhindert, dass Swipen ausgelöst wird
            const btn = document.getElementById('heartBtn');
            btn.classList.toggle('active');
        }

        // Swipe Logik (Touch & Mouse)
        const initDrag = (e) => {
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            card.style.transition = 'none';
        };

        const drag = (e) => {
            moveX = (e.type.includes('touch') ? e.touches[0].clientX : e.clientX) - startX;
            moveY = (e.type.includes('touch') ? e.touches[0].clientY : e.clientY) - startY;
            
            let rotation = moveX / 10;
            card.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotation}deg)`;
        };

        const endDrag = () => {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            
            card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            
            // Wenn weit genug gewischt wurde: "Rauswerfen" Animation
            if (Math.abs(moveX) > 150) {
                let endX = moveX > 0 ? 1000 : -1000;
                card.style.transform = `translate(${endX}px, ${moveY}px) rotate(${moveX/5}deg)`;
                
                // Nach 1 Sekunde zurücksetzen (für die Demo)
                setTimeout(() => {
                    card.style.transition = 'none';
                    card.style.transform = 'translate(0,0) rotate(0deg)';
                    setTimeout(() => card.style.transition = 'transform 0.5s ease', 50);
                }, 1000);
            } else {
                // Zurück in die Mitte
                card.style.transform = `translate(0, 0) rotate(0deg)`;
            }
        };

        card.addEventListener('mousedown', initDrag);
        card.addEventListener('touchstart', initDrag);
    </script>
</body>
  </html>
