<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotMe · Focus Engine V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04070a; --sur: #0c121a; --acc: #00e5c0;
            --warn: #7b5cfa; --danger: #ff4f7b; --text: #e8edf5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .brand { font-family: 'Syne'; font-weight: 800; color: var(--acc); font-size: 1.2rem; }

        .v4-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; padding: 0.8rem; background: #080c12; }
        .stat { background: rgba(255,255,255,0.03); padding: 0.5rem; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-v { display: block; font-family: 'Syne'; font-size: 1rem; font-weight: 800; }
        .stat-l { font-size: 0.55rem; text-transform: uppercase; opacity: 0.4; }

        canvas { flex: 1; width: 100%; }

        .controls { padding: 1.2rem; background: var(--sur); border-top: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .group-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.8rem; color: var(--acc); opacity: 0.8; }
        
        .slider-group { margin-bottom: 0.8rem; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 0.2rem; opacity: 0.7; }
        input[type=range] { width: 100%; accent-color: var(--acc); cursor: pointer; height: 4px; }
    </style>
</head>
<body>

<div class="header"><div class="brand">SPOTME ENGINE V4 · RESILIEZ-DASHBOARD</div></div>

<div class="v4-grid">
    <div class="stat"><span class="stat-l">Shield</span><span id="v-shield" class="stat-v" style="color:var(--acc)">0%</span></div>
    <div class="stat"><span class="stat-l">Willpower</span><span id="v-will" class="stat-v" style="color:#fbff00">0</span></div>
    <div class="stat"><span class="stat-l">Stress</span><span id="v-stress" class="stat-v" style="color:var(--danger)">0</span></div>
    <div class="stat"><span class="stat-l">Efficiency</span><span id="v-eff" class="stat-v">1.0</span></div>
</div>

<canvas id="stage"></canvas>

<div class="controls">
    <div class="col">
        <div class="group-title">🛡️ Armor (Immunsystem)</div>
        <div class="slider-group">
            <div class="slider-label"><span>Local Mode (h)</span><span id="l-dwell">4</span></div>
            <input type="range" id="s-dwell" min="0" max="24" value="4">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span>Manuelles Offline</span><span id="l-off">2</span></div>
            <input type="range" id="s-off" min="0" max="20" value="2">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span>Anrufe abgelehnt</span><span id="l-decl">1</span></div>
            <input type="range" id="s-decl" min="0" max="15" value="1">
        </div>
    </div>
    <div class="col">
        <div class="group-title">⚠️ Pressure (Einschlag)</div>
        <div class="slider-group">
            <div class="slider-label"><span>Profil-Views</span><span id="l-views">10</span></div>
            <input type="range" id="s-views" min="0" max="100" value="10">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span>Server Traffic (MB)</span><span id="l-traf">5</span></div>
            <input type="range" id="s-traf" min="0" max="50" value="5">
        </div>
        <div class="slider-group">
            <div class="slider-label"><span>Eing. Nachrichten</span><span id="l-msg">20</span></div>
            <input type="range" id="s-msg" min="0" max="200" value="20">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const sliders = {
        dwell: document.getElementById('s-dwell'),
        off: document.getElementById('s-off'),
        decl: document.getElementById('s-decl'),
        views: document.getElementById('s-views'),
        traf: document.getElementById('s-traf'),
        msg: document.getElementById('s-msg')
    };

    let width, height;
    let particles = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class IncomingData {
        constructor() { this.init(); }
        init() {
            const side = Math.floor(Math.random() * 4);
            if(side === 0) { this.x = Math.random() * width; this.y = -20; }
            else if(side === 1) { this.x = width + 20; this.y = Math.random() * height; }
            else if(side === 2) { this.x = Math.random() * width; this.y = height + 20; }
            else { this.x = -20; this.y = Math.random() * height; }
            this.speed = 1.5 + Math.random() * 2;
            this.inOrbit = false;
            this.angle = 0;
        }
        update(r, stress) {
            const dx = width/2 - this.x; const dy = height/2 - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(!this.inOrbit && dist < r && stress > 20) {
                this.inOrbit = true;
                this.angle = Math.atan2(this.y - height/2, this.x - width/2);
            }
            if(this.inOrbit) {
                this.angle += 0.02 * (stress/50 + 0.5);
                this.x = width/2 + Math.cos(this.angle) * r;
                this.y = height/2 + Math.sin(this.angle) * r;
                if(stress < 15) this.inOrbit = false;
            } else {
                this.x += (dx/dist) * this.speed;
                this.y += (dy/dist) * this.speed;
            }
            if(dist < 10) this.init();
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
            ctx.fillStyle = this.inOrbit ? '#ff4f7b' : '#fbff00';
            ctx.fill();
        }
    }

    for(let i=0; i<150; i++) particles.push(new IncomingData());

    function render() {
        ctx.fillStyle = '#04070a';
        ctx.fillRect(0, 0, width, height);

        const v = {
            dwell: parseInt(sliders.dwell.value),
            off: parseInt(sliders.off.value),
            decl: parseInt(sliders.decl.value),
            views: parseInt(sliders.views.value),
            traf: parseInt(sliders.traf.value),
            msg: parseInt(sliders.msg.value)
        };

        // UI Labels
        Object.keys(v).forEach(k => document.getElementById('l-'+k).innerText = v[k]);

        // ALGORITHMUS V4
        // Armor (A) = Wille + Zeit. Wer aktiv ablehnt (off/decl), baut massiv Rüstung auf.
        const armor = (v.dwell * 4) + (v.off * 15) + (v.decl * 10);
        // Pressure (P) = Reize von außen. Profil-Views verbrauchen Fokus-Energie.
        const pressure = (v.msg * 0.8) + (v.views * 2.5) + (v.traf * 3);
        
        const shieldRadius = 40 + (armor * 0.8);
        const stress = pressure - (armor * 0.6);

        // Stats Dashboard
        document.getElementById('v-shield').innerText = Math.round(armor) + "%";
        document.getElementById('v-will').innerText = (v.off + v.decl);
        document.getElementById('v-stress').innerText = Math.max(0, Math.round(stress));
        document.getElementById('v-eff').innerText = (1 + (armor/100)).toFixed(1);

        // Schild
        ctx.beginPath(); ctx.arc(width/2, height/2, shieldRadius, 0, Math.PI*2);
        ctx.strokeStyle = stress > 40 ? '#ff4f7b' : '#00e5c0';
        ctx.setLineDash([5, 10]); ctx.stroke(); ctx.setLineDash([]);

        // User Orb
        ctx.beginPath(); ctx.arc(width/2, height/2, 16, 0, Math.PI*2);
        ctx.fillStyle = stress > 50 ? '#ff4f7b' : (stress > 20 ? '#7b5cfa' : '#00e5c0');
        ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle; ctx.fill(); ctx.shadowBlur = 0;

        const pCount = Math.min(150, Math.floor(v.msg * 0.7 + v.views * 0.5));
        for(let i=0; i<pCount; i++) {
            particles[i].update(shieldRadius, stress);
            particles[i].draw();
        }

        requestAnimationFrame(render);
    }
    render();
</script>
</body>
                </html>
