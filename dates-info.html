<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotMe · Focus Engine V2</title>
<style>
:root {
  --bg: #060a0f;
  --acc: #00e5c0;
  --warn: #7b5cfa;
  --danger: #ff4f7b;
  --text: #e8edf5;
}

body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

.header { padding: 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.brand { font-family: 'Syne'; font-weight: 800; font-size: 1.1rem; color: var(--acc); }

/* Dashboard */
.dashboard {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
  padding: 1rem; max-width: 600px; margin: 0 auto; width: 100%;
}
.stat-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  padding: 0.6rem; border-radius: 12px; text-align: center;
}
.stat-val { font-family: 'Syne'; font-size: 1.2rem; font-weight: 800; display: block; }
.stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; letter-spacing: 0.05em; }

canvas { flex: 1; cursor: crosshair; }

.controls {
  padding: 1rem; background: rgba(8, 12, 16, 0.9); backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; flex-direction: column; gap: 0.8rem;
}
.slider-group { width: 100%; max-width: 450px; margin: 0 auto; }
.slider-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.2rem; }

input[type=range] { width: 100%; accent-color: var(--acc); cursor: pointer; }

#feedback { text-align: center; font-size: 0.8rem; font-weight: 500; height: 1em; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">SPOTME · FOCUS ENGINE V2</div>
</div>

<div class="dashboard">
  <div class="stat-card">
    <span class="stat-label">Dwell Time</span>
    <span id="val-dwell" class="stat-val" style="color: var(--acc);">0h</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">Lokal Gesendet</span>
    <span id="val-sent" class="stat-val" style="color: #fbff00;">0</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">Traffic</span>
    <span id="val-traffic" class="stat-val" style="color: var(--danger);">0%</span>
  </div>
</div>

<canvas id="stage"></canvas>

<div class="controls">
  <div id="feedback">Analysiere Fokus-Feld...</div>
  
  <div class="slider-group">
    <div class="slider-label"><span>Handy-Ruhe (Dwell Time)</span><span id="lbl-dwell">0h</span></div>
    <input type="range" id="slide-dwell" min="0" max="24" value="4">
  </div>
  
  <div class="slider-group">
    <div class="slider-label"><span>Lokal geschriebene Nachrichten</span><span id="lbl-sent">0</span></div>
    <input type="range" id="slide-sent" min="0" max="50" value="5">
  </div>

  <div class="slider-group">
    <div class="slider-label"><span>Online Rauschen (Traffic)</span><span id="lbl-traffic">20%</span></div>
    <input type="range" id="slide-traffic" min="0" max="100" value="20">
  </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const sDwell = document.getElementById('slide-dwell');
const sSent = document.getElementById('slide-sent');
const sTraffic = document.getElementById('slide-traffic');
const feedback = document.getElementById('feedback');

let particles = [];
let width, height;

function resize() {
  width = canvas.width = canvas.offsetWidth;
  height = canvas.height = canvas.offsetHeight;
}
window.onresize = resize;
resize();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = Math.random() * width; this.y = -20; }
    if(side === 1) { this.x = width + 20; this.y = Math.random() * height; }
    if(side === 2) { this.x = Math.random() * width; this.y = height + 20; }
    if(side === 3) { this.x = -20; this.y = Math.random() * height; }
    
    this.vx = (width/2 - this.x) * (0.005 + Math.random() * 0.01);
    this.vy = (height/2 - this.y) * (0.005 + Math.random() * 0.01);
    this.inOrbit = false;
    this.angle = Math.random() * Math.PI * 2;
    this.color = '#fbff00';
  }

  update(shieldRadius, stress) {
    const dx = width/2 - this.x;
    const dy = height/2 - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(!this.inOrbit && dist < shieldRadius && stress > 20) {
      this.inOrbit = true;
    }

    if(this.inOrbit) {
      this.angle += 0.02;
      this.x = width/2 + Math.cos(this.angle) * shieldRadius;
      this.y = height/2 + Math.sin(this.angle) * shieldRadius;
      this.color = '#ff4f7b';
    } else {
      this.x += this.vx;
      this.y += this.vy;
      this.color = '#fbff00';
    }

    if(dist < 10) this.reset();
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function initParticles() {
  particles = Array.from({length: 60}, () => new Particle());
}
initParticles();

function draw() {
  ctx.fillStyle = '#060a0f';
  ctx.fillRect(0, 0, width, height);

  const dwell = parseInt(sDwell.value);
  const sent = parseInt(sSent.value);
  const traffic = parseInt(sTraffic.value);

  // Dashboard & Labels
  document.getElementById('val-dwell').innerText = dwell + "h";
  document.getElementById('val-sent').innerText = sent;
  document.getElementById('val-traffic').innerText = traffic + "%";
  document.getElementById('lbl-dwell').innerText = dwell + "h";
  document.getElementById('lbl-sent').innerText = sent;
  document.getElementById('lbl-traffic').innerText = traffic + "%";

  // ALGORITHMUS V2:
  // Dwell Time = Basis-Schild
  // Sent Messages = Schild-Härte (Bonus-Radius + Glanz)
  const shieldRadius = 40 + (dwell * 5) + (sent * 2);
  const stress = traffic - (dwell * 2) - (sent * 1.5);

  // Schild zeichnen
  ctx.beginPath();
  ctx.arc(width/2, height/2, shieldRadius, 0, Math.PI * 2);
  ctx.strokeStyle = (stress > 50) ? '#ff4f7b' : '#00e5c0';
  ctx.setLineDash([5, 5]);
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.3;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1.0;

  // Zentraler User-Orb
  ctx.beginPath();
  ctx.arc(width/2, height/2, 15, 0, Math.PI * 2);
  ctx.fillStyle = (stress > 50) ? '#ff4f7b' : (stress > 20 ? '#7b5cfa' : '#00e5c0');
  ctx.shadowBlur = 20;
  ctx.shadowColor = ctx.fillStyle;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Feedback Text
  if(stress < 0) feedback.innerText = "UNZERSTÖRBAR: Dein lokaler Fokus ist perfekt.";
  else if(stress < 30) feedback.innerText = "STABIL: Nachrichten werden sanft gefiltert.";
  else feedback.innerText = "REIZÜBERFLUTUNG: Siphon aktiv – Fokus wird geschützt.";
  feedback.style.color = ctx.fillStyle;

  // Partikel Updates
  particles.forEach(p => {
    p.update(shieldRadius, stress);
    p.draw();
  });

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
