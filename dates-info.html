<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotMe · Focus Engine V3</title>
<style>
:root {
  --bg: #060a0f;
  --acc: #00e5c0;
  --warn: #7b5cfa;
  --danger: #ff4f7b;
  --text: #e8edf5;
}

body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

.header { padding: 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.brand { font-family: 'Syne'; font-weight: 800; font-size: 1.1rem; color: var(--acc); }

.dashboard {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
  padding: 1rem; max-width: 600px; margin: 0 auto; width: 100%;
}
.stat-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  padding: 0.6rem; border-radius: 12px; text-align: center;
}
.stat-val { font-family: 'Syne'; font-size: 1.2rem; font-weight: 800; display: block; }
.stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; letter-spacing: 0.05em; }

canvas { flex: 1; width: 100%; height: 100%; }

.controls {
  padding: 1.5rem; background: rgba(8, 12, 16, 0.95); backdrop-filter: blur(15px);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; flex-direction: column; gap: 1rem;
}
.slider-group { width: 100%; max-width: 450px; margin: 0 auto; }
.slider-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.4rem; }

input[type=range] { width: 100%; accent-color: var(--acc); cursor: pointer; }

#feedback { text-align: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">SPOTME · FOCUS ENGINE V3</div>
</div>

<div class="dashboard">
  <div class="stat-card">
    <span class="stat-label">Dwell Time</span>
    <span id="val-dwell" class="stat-val" style="color: var(--acc);">0h</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">Lokal Gesendet</span>
    <span id="val-sent" class="stat-val" style="color: #fbff00;">0</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">Traffic</span>
    <span id="val-traffic" class="stat-val" style="color: var(--danger);">0%</span>
  </div>
</div>

<canvas id="stage"></canvas>

<div class="controls">
  <div id="feedback">Initialisiere...</div>
  
  <div class="slider-group">
    <div class="slider-label"><span>Handy-Ruhe (Dwell Time)</span><span id="lbl-dwell">4h</span></div>
    <input type="range" id="slide-dwell" min="0" max="24" value="4">
  </div>
  
  <div class="slider-group">
    <div class="slider-label"><span>Lokal geschriebene Nachrichten</span><span id="lbl-sent">5</span></div>
    <input type="range" id="slide-sent" min="0" max="100" value="5">
  </div>

  <div class="slider-group">
    <div class="slider-label"><span>Online Rauschen (Traffic)</span><span id="lbl-traffic">20%</span></div>
    <input type="range" id="slide-traffic" min="0" max="100" value="20">
  </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const sDwell = document.getElementById('slide-dwell');
const sSent = document.getElementById('slide-sent');
const sTraffic = document.getElementById('slide-traffic');
const feedback = document.getElementById('feedback');

let width, height;
let particles = [];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

class MessagePing {
  constructor() { this.init(); }
  init() {
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = Math.random() * width; this.y = -30; }
    else if(side === 1) { this.x = width + 30; this.y = Math.random() * height; }
    else if(side === 2) { this.x = Math.random() * width; this.y = height + 30; }
    else { this.x = -30; this.y = Math.random() * height; }
    
    this.speed = 1 + Math.random() * 2;
    this.angle = 0;
    this.inOrbit = false;
    this.color = '#fbff00';
    this.orbitClockwise = Math.random() > 0.5;
  }

  update(shieldR, stress) {
    const dx = width/2 - this.x;
    const dy = height/2 - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Schild-Kollision
    if(!this.inOrbit && dist < shieldR && stress > 15) {
      this.inOrbit = true;
      this.angle = Math.atan2(this.y - height/2, this.x - width/2);
    }

    if(this.inOrbit) {
      // Rotieren im Orbit (Siphon-Effekt)
      this.angle += (this.orbitClockwise ? 0.015 : -0.015) * (stress/50 + 0.5);
      this.x = width/2 + Math.cos(this.angle) * shieldR;
      this.y = height/2 + Math.sin(this.angle) * shieldR;
      this.color = '#ff4f7b';
      // Wenn Stress sinkt, bricht Ping aus dem Orbit aus
      if(stress < 10) this.inOrbit = false;
    } else {
      // Direkter Flug zum User
      const moveX = dx / dist * this.speed;
      const moveY = dy / dist * this.speed;
      this.x += moveX;
      this.y += moveY;
      this.color = '#fbff00';
    }

    if(dist < 10) this.init();
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 5;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Initialisiere Partikel
for(let i=0; i<80; i++) particles.push(new MessagePing());

function render() {
  // Aktuelle Slider-Werte bei jedem Frame abgreifen
  const dwell = parseInt(sDwell.value);
  const sent = parseInt(sSent.value);
  const traffic = parseInt(sTraffic.value);

  // Stats Update
  document.getElementById('val-dwell').innerText = dwell + "h";
  document.getElementById('val-sent').innerText = sent;
  document.getElementById('val-traffic').innerText = traffic + "%";
  document.getElementById('lbl-dwell').innerText = dwell + "h";
  document.getElementById('lbl-sent').innerText = sent;
  document.getElementById('lbl-traffic').innerText = traffic + "%";

  // Hintergrund
  ctx.fillStyle = '#060a0f';
  ctx.fillRect(0, 0, width, height);

  // ALGORITHMUS V3:
  // Dwell Time = Grundradius des Schildes
  // Sent Messages = Schild-Härte & Reparatur (reduziert Stress massiv)
  const shieldRadius = 50 + (dwell * 6) + (sent * 1.5);
  const stress = traffic - (dwell * 2.5) - (sent * 2.0);

  // Schutzschild zeichnen
  ctx.beginPath();
  ctx.arc(width/2, height/2, shieldRadius, 0, Math.PI * 2);
  ctx.strokeStyle = (stress > 40) ? '#ff4f7b' : '#00e5c0';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 5]);
  ctx.globalAlpha = 0.2 + (dwell/50);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1.0;

  // Zentraler User
  let orbColor = '#00e5c0';
  if(stress > 20) orbColor = '#7b5cfa';
  if(stress > 50) orbColor = '#ff4f7b';

  ctx.beginPath();
  ctx.arc(width/2, height/2, 18, 0, Math.PI * 2);
  ctx.fillStyle = orbColor;
  ctx.shadowBlur = 15;
  ctx.shadowColor = orbColor;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Feedback Text
  if(stress < 0) {
    feedback.innerText = "UNZERSTÖRBAR: Dein Fokus ist eine Festung.";
    feedback.style.color = "#00e5c0";
  } else if(stress < 40) {
    feedback.innerText = "BALANCED: Gesunder Flow.";
    feedback.style.color = "#7b5cfa";
  } else {
    feedback.innerText = "STRESS: Siphon filtert Traffic!";
    feedback.style.color = "#ff4f7b";
  }

  // Partikel-Anzahl basierend auf Traffic anpassen
  const activeCount = Math.floor(traffic * 0.8);
  for(let i=0; i < activeCount; i++) {
    if(particles[i]) {
      particles[i].update(shieldRadius, stress);
      particles[i].draw();
    }
  }

  requestAnimationFrame(render);
}

// Start der Endlosschleife
render();
</script>
</body>
</html>
