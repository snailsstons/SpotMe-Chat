<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpotMe · SpotCaching</title>
  <meta name="theme-color" content="#ff9a00">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #060a0f;
      --sur: #0c1219;
      --card: #101820;
      --card2: #141f2e;
      --bord: rgba(255,255,255,0.08);
      --acc: #ff9a00;
      --text: #dde4f0;
      --muted: #7a8fa8;
      --green: #1ecc68;
      --red: #e74c3c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 16px;
      touch-action: manipulation;
    }
    body { display: flex; flex-direction: column; }

    .app-header {
      display: flex; align-items: center; padding: 0.5rem 1rem;
      background: var(--sur); border-bottom: 1px solid var(--bord);
      flex-shrink: 0; z-index: 100;
    }
    .logo { font-family: 'Syne',sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--acc); margin-right: auto; }
    .logo span { font-weight: 300; opacity: 0.7; font-size: 0.8rem; }
    .header-btn {
      background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--muted);
      width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer;
      margin-left: 0.4rem; display: flex; align-items: center; justify-content: center;
    }
    .header-btn:active { background: rgba(255,154,0,0.15); border-color: var(--acc); }

    #map-container { flex: 1; width: 100%; min-height: 0; }
    #map { width: 100%; height: 100%; }
    .leaflet-control-zoom { margin-bottom: 120px !important; margin-right: 10px !important; }
    .leaflet-control-attribution { display: none !important; }

    .info-bar {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.4rem 0.5rem;
      background: var(--sur); border-top: 1px solid var(--bord);
      font-size: 0.75rem; color: var(--muted); flex-shrink: 0;
    }
    .info-bar span { color: var(--acc); font-weight: 700; }

    .action-bar {
      display: flex; gap: 0.4rem; padding: 0.5rem;
      background: var(--sur); border-top: 1px solid var(--bord);
      overflow-x: auto; flex-shrink: 0;
    }
    .action-btn {
      padding: 0.55rem 1rem; border-radius: 20px; border: 1px solid var(--acc);
      background: var(--acc); color: #fff; font-weight: 700; font-size: 0.78rem;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: 'DM Sans', sans-serif;
    }
    .action-btn.secondary { background: transparent; color: var(--acc); border-color: rgba(255,154,0,0.3); }
    .action-btn.alert { background: var(--red); border-color: var(--red); color: #fff; }
    .action-btn:active { opacity: 0.8; transform: scale(0.97); }

    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; max-height: 50vh;
      background: var(--card); border-top-left-radius: 20px; border-top-right-radius: 20px;
      border: 1px solid var(--bord); padding: 0.8rem 1rem 2.5rem; overflow-y: auto;
      z-index: 500; transform: translateY(100%); transition: transform 0.3s ease;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px; background: rgba(255,255,255,0.2);
      border-radius: 2px; margin: 0 auto 0.6rem; cursor: pointer;
    }
    .sheet-title {
      font-family: 'Syne', sans-serif; font-size: 1rem; color: var(--acc);
      margin-bottom: 0.6rem; text-align: center;
    }
    .sheet-item {
      background: var(--card2); border-radius: 12px; padding: 0.7rem 0.9rem;
      margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.6rem;
    }
    .sheet-item .si-icon { font-size: 1.5rem; flex-shrink: 0; }
    .sheet-item .si-info { flex: 1; min-width: 0; }
    .sheet-item .si-name { font-weight: 600; font-size: 0.9rem; }
    .sheet-item .si-detail { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
    .sheet-item .si-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .si-btn {
      padding: 0.35rem 0.7rem; border-radius: 10px; border: none;
      font-size: 0.7rem; font-weight: 600; cursor: pointer; color: #fff;
      background: var(--acc); white-space: nowrap;
    }
    .si-btn.accept { background: var(--green); }
    .si-btn.navigate { background: #3498db; }
    .si-btn.cancel { background: var(--red); }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 600; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--card); border-radius: 18px; padding: 1.2rem;
      width: 92%; max-width: 370px; border: 1px solid var(--bord);
      color: var(--text); position: relative;
    }
    .modal-close {
      position: absolute; top: 8px; right: 12px; background: none;
      border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer;
    }
    .finp {
      width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
      background: var(--sur); border: 1px solid var(--bord); border-radius: 10px;
      color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none;
    }
    .finp:focus { border-color: var(--acc); }
    .form-label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
    .modal-btns { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    .modal-btns button { flex: 1; }

    /* Profil-Modal */
    .profile-avatar-large {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--acc), #ff4f7b);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 0.5rem; overflow: hidden;
    }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.5rem 0; }
    .profile-tag {
      background: rgba(255,154,0,0.15); color: var(--acc);
      padding: 2px 10px; border-radius: 12px; font-size: 0.7rem;
    }

    .match-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 700; align-items: center; justify-content: center;
      flex-direction: column; text-align: center; padding: 2rem;
    }
    .match-overlay.show { display: flex; }
    .match-emoji { font-size: 5rem; animation: bounce 0.6s ease infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .match-title { font-family: 'Syne', sans-serif; color: var(--acc); font-size: 1.8rem; margin: 1rem 0; }
    .match-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    .match-spot { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .match-btn {
      padding: 0.8rem 2rem; border-radius: 20px; border: none;
      background: var(--green); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
<header class="app-header">
  <div class="logo">SPOT<b>ME</b> <span>· Caching</span></div>
  <button class="header-btn" onclick="location.href='index.html'">‹</button>
  <button class="header-btn" onclick="location.href='profil-caching.html'">👤</button>
  <button class="header-btn" onclick="location.reload()">↺</button>
</header>

<div id="map-container"><div id="map"></div></div>

<div class="info-bar" id="infoBar">
  <span id="spotCount">0</span> Spots ·
  <span id="inviteCount">0</span> Einladungen
</div>

<div class="action-bar">
  <button class="action-btn" onclick="startPlaceMode()">📍 Spot setzen</button>
  <button class="action-btn secondary" onclick="showMySpots()">🟠 Meine</button>
  <button class="action-btn secondary" id="inviteBtn" onclick="showInvites()">📨 Einladungen</button>
  <button class="action-btn secondary" onclick="openRadiusSearch()">🔍 Umkreis</button>
</div>

<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" onclick="closeSheet()"></div>
  <div class="sheet-title" id="sheetTitle"></div>
  <div id="sheetContent"></div>
</div>

<div class="modal-overlay" id="spotFormModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <h3 style="font-family:'Syne';color:var(--acc);text-align:center;margin-bottom:0.8rem;">📍 Spot anlegen</h3>
    <input id="spotName" class="finp" placeholder="Name (z.B. Schöner Brunnen)" maxlength="50">
    <input id="spotDesc" class="finp" placeholder="Beschreibung (optional)" maxlength="100">
    <label class="form-label">Wunsch-Tag:</label>
    <select id="spotWish" class="finp"></select>
    <div class="modal-btns">
      <button onclick="saveSpot()" style="background:var(--acc);color:#fff;">💾 Speichern</button>
      <button class="secondary" onclick="closeModals()" style="background:transparent;border:1px solid var(--bord);color:var(--muted);">Abbrechen</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="inviteModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <h3 style="font-family:'Syne';color:var(--acc);text-align:center;margin-bottom:0.8rem;">📨 Einladung senden</h3>
    <p id="inviteSpotInfo" style="text-align:center;margin-bottom:0.8rem;font-size:0.9rem;"></p>
    <label class="form-label">Zeitraum wählen:</label>
    <input type="datetime-local" id="inviteStart" class="finp">
    <input type="datetime-local" id="inviteEnd" class="finp">
    <div class="modal-btns">
      <button onclick="sendInvite()" style="background:var(--acc);color:#fff;">Einladung senden</button>
      <button class="secondary" onclick="closeModals()" style="background:transparent;border:1px solid var(--bord);color:var(--muted);">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Radius-Filter Modal -->
<div class="modal-overlay" id="radiusModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <h3 style="font-family:'Syne';color:var(--acc);text-align:center;margin-bottom:0.8rem;">🔍 Umkreissuche</h3>
    <label class="form-label">Radius wählen:</label>
    <select id="radiusSelect" class="finp">
      <option value="1000">1 km</option>
      <option value="2000" selected>2 km</option>
      <option value="5000">5 km</option>
      <option value="10000">10 km</option>
    </select>
    <div class="modal-btns">
      <button onclick="applyRadiusFilter()" style="background:var(--acc);color:#fff;">Anwenden</button>
      <button class="secondary" onclick="closeModals()" style="background:transparent;border:1px solid var(--bord);color:var(--muted);">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Profil-Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <div id="profileModalContent"></div>
  </div>
</div>

<div class="match-overlay" id="matchOverlay">
  <div class="match-emoji">🎉</div>
  <div class="match-title">Ihr habt euch gefunden!</div>
  <div class="match-name" id="matchName"></div>
  <div class="match-spot" id="matchSpot"></div>
  <button class="match-btn" onclick="closeMatch()">✨ Weiter</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

const API = 'https://spotme-chat-obom.onrender.com/api';
const CODE = localStorage.getItem('sm_code') || '000000';

let map, userPos, placeMode = false, tempLatLng = null;
let mySpots = [], allSpots = [], currentSpots = [];
let selectedInviteSpot = null;
let invitePollInterval = null, knownInviteCount = 0;
let radiusCircles = [];

// ════════ KARTE ════════
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([39.47, -0.38], 14);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OSM', maxZoom: 19
  }).addTo(map);

  navigator.geolocation?.getCurrentPosition(pos => {
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    L.marker([userPos.lat, userPos.lng], {
      icon: L.divIcon({ html: '<div style="background:#3b82f6;width:14px;height:14px;border-radius:50%;border:2px solid #fff;"></div>', iconSize: [18,18] })
    }).addTo(map).bindPopup('📍 Du').openPopup();
    map.setView([userPos.lat, userPos.lng], 15);
    fetch(API+'/location', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE, lat:userPos.lat, lng:userPos.lng, spot:'caching'}) }).catch(()=>{});
  });

  map.on('click', e => {
    if (placeMode) {
      tempLatLng = e.latlng;
      L.circleMarker([e.latlng.lat, e.latlng.lng], { radius:7, color:'#ff9a00', fillOpacity:0.6 }).addTo(map);
      placeMode = false;
      openSpotForm();
    }
  });

  loadAllSpots();
  startInvitePolling();
  if ('Notification' in window) Notification.requestPermission();
}

// ════════ SPOTS ════════
async function loadAllSpots() {
  try {
    const r = await fetch(API+'/userspots/all');
    if (r.ok) allSpots = await r.json();
  } catch(e) {
    allSpots = [
      { id:101, code:'111111', lat:39.473, lng:-0.377, name:'Geheimer Garten', wishTag:'Park' },
      { id:102, code:'222222', lat:39.469, lng:-0.381, name:'Sonnenplatz', wishTag:'Kaffee' },
      { id:103, code:'333333', lat:39.471, lng:-0.374, name:'Aussichtspunkt', wishTag:'Spaziergang' }
    ];
  }
  currentSpots = allSpots;
  mySpots = currentSpots.filter(s => s.code === CODE);
  document.getElementById('spotCount').textContent = mySpots.length;
  renderAllMarkers();
}

function renderAllMarkers() {
  map.eachLayer(l => { if (l.options?.className==='spot-marker') map.removeLayer(l); });
  currentSpots.forEach(s => {
    const isMine = s.code === CODE;
    const starColor = isMine ? '#ff9a00' : '#66ccff';
    const icon = L.divIcon({
      html: `<div style="font-size:32px; color:${starColor}; line-height:1; text-shadow: 0 0 6px rgba(0,0,0,0.5);">✴️</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -16],
      className: 'spot-marker'
    });
    const m = L.marker([s.lat, s.lng], { icon }).addTo(map);

    let popup = `<b>${esc(s.name)}</b><br>💭 ${s.wishTag}`;
    if (!isMine) {
      popup += `<br><button onclick="openInviteFromSpot(${s.id},'${esc(s.name)}','${s.wishTag}')" style="margin-top:4px;padding:4px 10px;background:#ff9a00;border:none;border-radius:8px;color:#fff;cursor:pointer;">📨 Einladung</button>`;
      popup += `<br><button onclick="navigateToSpot(${s.lat},${s.lng})" style="margin-top:3px;padding:4px 10px;background:#3498db;border:none;border-radius:8px;color:#fff;cursor:pointer;">🧭 Navigation</button>`;
      popup += `<br><button onclick="showSpotOwnerProfile('${s.code}')" style="margin-top:3px;padding:4px 10px;background:#7a8fa8;border:none;border-radius:8px;color:#fff;cursor:pointer;">👤 Profil</button>`;
    } else {
      popup += `<br><button onclick="deleteSpot(${s.id})" style="margin-top:4px;padding:4px 10px;background:#e74c3c;border:none;border-radius:8px;color:#fff;cursor:pointer;">🗑️ Löschen</button>`;
    }
    m.bindPopup(popup);
  });
}

// ════════ PROFIL ANZEIGEN (MIT ECHTHEITS-VERIFIKATION) ════════
async function showSpotOwnerProfile(ownerCode) {
  const modal = document.getElementById('profileModal');
  const content = document.getElementById('profileModalContent');
  content.innerHTML = '<p style="text-align:center;color:var(--muted);">Lade Profil…</p>';
  modal.classList.add('show');

  try {
    const [profileRes, avatarRes, verifRes] = await Promise.all([
      fetch(`${API}/profile/${ownerCode}?spot=caching`),
      fetch(`${API}/avatar/${ownerCode}?spot=caching`),
      fetch(`${API}/verifications/${ownerCode}?spot=caching`)
    ]);

    const profile = profileRes.ok ? await profileRes.json() : null;
    const avatarData = avatarRes.ok ? await avatarRes.json() : null;
    const verifications = verifRes.ok ? await verifRes.json() : [];

    if (!profile || !profile.name) {
      content.innerHTML = '<p style="text-align:center;color:var(--muted);">Profil nicht gefunden.</p>';
      return;
    }

    const personalCount = verifications.filter(v => v.type === 'personal').length;
    const verifiedBadge = personalCount > 0
      ? `<div style="color:#1ecc68; font-weight:600; font-size:0.8rem; margin-top:4px;">✓ Persönlich getroffen (${personalCount})</div>`
      : '';

    const initial = profile.name[0]?.toUpperCase() || '?';
    const wishes = profile.wishTags?.join(', ') || profile.wishes?.join(', ') || 'Keine Wünsche';
    const offers = profile.offerTags?.join(', ') || profile.offers?.join(', ') || 'Keine Angebote';
    const bio = profile.bio || 'Keine Beschreibung';
    const avatarUrl = avatarData?.avatar || null;
    const avatarHTML = avatarUrl
      ? `<img src="${avatarUrl}" alt="Avatar">`
      : initial;

    content.innerHTML = `
      <div style="text-align:center;">
        <div class="profile-avatar-large">${avatarHTML}</div>
        <h3 style="font-family:'Syne';color:var(--acc);">${esc(profile.name)}</h3>
        ${verifiedBadge}
      </div>
      <div class="profile-tags">
        <span class="profile-tag">💭 Wünsche: ${esc(wishes)}</span>
        <span class="profile-tag">🎁 Bietet: ${esc(offers)}</span>
      </div>
      <p style="font-size:0.85rem;color:var(--muted);margin-top:0.5rem;">${esc(bio)}</p>
    `;
  } catch(e) {
    content.innerHTML = '<p style="text-align:center;color:var(--muted);">Fehler beim Laden.</p>';
  }
}

function startPlaceMode() {
  placeMode = true;
  alert('📍 Tippe jetzt auf die Karte, wo dein Spot sein soll.');
}

function openSpotForm() {
  const profile = JSON.parse(localStorage.getItem('sm_profile_caching')||'{}');
  const wishes = profile.wishes?.length ? profile.wishes : ['Kaffee','Strand','Park'];
  document.getElementById('spotWish').innerHTML = wishes.map(w=>`<option value="${w}">${w}</option>`).join('');
  document.getElementById('spotName').value = '';
  document.getElementById('spotDesc').value = '';
  document.getElementById('spotFormModal').classList.add('show');
}

async function saveSpot() {
  const name = document.getElementById('spotName').value.trim();
  const desc = document.getElementById('spotDesc').value.trim();
  const wish = document.getElementById('spotWish').value;
  if (!name || !tempLatLng) return;
  closeModals();
  try {
    await fetch(API+'/userspots', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE, lat:tempLatLng.lat, lng:tempLatLng.lng, name, description:desc, wishTag:wish}) });
  } catch(e) {}
  loadAllSpots();
}

// ════════ SPOT LÖSCHEN (MIT SCHUTZ) ════════
async function canDeleteSpot(spotId) {
  try {
    const r = await fetch(API+'/spotcache/invites/'+CODE);
    if (!r.ok) return true;
    const invites = await r.json();
    const hasActive = invites.some(inv => inv.spotId === spotId && (inv.status === 'pending' || inv.status === 'accepted'));
    return !hasActive;
  } catch(e) { return true; }
}

async function deleteSpot(id) {
  if (!confirm('Spot löschen?')) return;
  const allowed = await canDeleteSpot(id);
  if (!allowed) {
    alert('⚠️ Dieser Spot hat aktive Einladungen und kann nicht gelöscht werden. Storniere zuerst die Einladungen.');
    return;
  }
  try { await fetch(API+'/userspots/'+id, { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE}) }); } catch(e){}
  loadAllSpots();
}

// ════════ KOMPASS ════════
function navigateToSpot(lat, lng) {
  if (!userPos) return alert('❌ Standort unbekannt');
  const dist = Math.round(Math.sqrt((userPos.lat-lat)**2+(userPos.lng-lng)**2)*111000);
  const angle = Math.atan2(lng-userPos.lng, lat-userPos.lat)*180/Math.PI;
  const dirs = ['↑ N','↗ NO','→ O','↘ SO','↓ S','↙ SW','← W','↖ NW'];
  const dir = dirs[Math.round(angle/45)%8];
  map.setView([(userPos.lat+lat)/2, (userPos.lng+lng)/2], 15);
  L.marker([lat, lng], { icon: L.divIcon({ html:'🎯', iconSize:[30,30] }) }).addTo(map).bindPopup('Ziel').openPopup();
  setTimeout(() => alert(`🧭 ${dir} · ${dist}m`), 300);
}

// ════════ UMGEBUNGSFILTER ════════
function openRadiusSearch() {
  document.getElementById('radiusModal').classList.add('show');
}

function applyRadiusFilter() {
  const radiusMeters = parseInt(document.getElementById('radiusSelect').value);
  if (!userPos) {
    alert('❌ Dein Standort ist nicht bekannt. Erlaube GPS und versuche es erneut.');
    return;
  }

  // Alte Kreise entfernen
  radiusCircles.forEach(c => map.removeLayer(c));
  radiusCircles = [];

  // Hilfskreise bei 2km, 5km, 10km (nur wenn sie größer sind als der gewählte Radius)
  const helperRadii = [2000, 5000, 10000].filter(r => r >= radiusMeters);
  const colors = ['rgba(255,154,0,0.15)', 'rgba(255,154,0,0.1)', 'rgba(255,154,0,0.05)'];
  helperRadii.forEach((r, i) => {
    const circle = L.circle([userPos.lat, userPos.lng], {
      radius: r,
      color: 'transparent',
      fillColor: '#ff9a00',
      fillOpacity: 0.08,
      weight: 0.5,
      dashArray: '5 5',
      interactive: false
    }).addTo(map);
    radiusCircles.push(circle);
  });

  // Aktiven Radius-Kreis zeichnen
  const activeCircle = L.circle([userPos.lat, userPos.lng], {
    radius: radiusMeters,
    color: '#ff9a00',
    weight: 2,
    fillOpacity: 0.05,
    interactive: false
  }).addTo(map);
  radiusCircles.push(activeCircle);

  // Spots filtern
  currentSpots = allSpots.filter(s => {
    const dist = Math.sqrt(Math.pow(userPos.lat - s.lat, 2) + Math.pow(userPos.lng - s.lng, 2)) * 111000;
    return dist <= radiusMeters;
  });

  mySpots = currentSpots.filter(s => s.code === CODE);
  const totalCount = currentSpots.length;
  document.getElementById('infoBar').innerHTML = `
    <span id="spotCount">${mySpots.length}</span> deiner Spots ·
    <span style="color:#66ccff;">${totalCount}</span> im Umkreis ·
    <button onclick="resetRadiusFilter()" style="background:none;border:1px solid var(--acc);color:var(--acc);border-radius:12px;padding:2px 8px;font-size:0.7rem;cursor:pointer;">↺ Alle Spots</button>
  `;
  renderAllMarkers();
  closeModals();
}

function resetRadiusFilter() {
  // Alle Kreise entfernen
  radiusCircles.forEach(c => map.removeLayer(c));
  radiusCircles = [];

  currentSpots = allSpots;
  mySpots = currentSpots.filter(s => s.code === CODE);
  document.getElementById('infoBar').innerHTML = `
    <span id="spotCount">${mySpots.length}</span> Spots ·
    <span id="inviteCount">${knownInviteCount}</span> Einladungen
  `;
  renderAllMarkers();
}
  
// ════════ EINLADUNGEN ════════
function startInvitePolling() {
  if (invitePollInterval) clearInterval(invitePollInterval);
  invitePollInterval = setInterval(async () => {
    try {
      const r = await fetch(API+'/spotcache/invites/'+CODE);
      if (!r.ok) return;
      const invites = await r.json();
      const count = invites.length;
      const icEl = document.getElementById('inviteCount');
      if (icEl) icEl.textContent = count;
      const btn = document.getElementById('inviteBtn');
      if (count > knownInviteCount && knownInviteCount > 0) {
        btn.classList.add('alert'); btn.classList.remove('secondary');
        btn.textContent = `📨 ${count} neue!`;
        if (Notification.permission === 'granted') {
          new Notification('🧭 Neue Einladung!', { body: 'Jemand möchte sich an deinem Spot treffen.' });
        }
      } else if (count === 0) {
        btn.classList.remove('alert'); btn.classList.add('secondary');
        btn.textContent = '📨 Einladungen';
      }
      knownInviteCount = count;
    } catch(e) {}
  }, 8000);
}

function openInviteFromSpot(spotId, name, wish) {
  selectedInviteSpot = { id: spotId, name, wish };
  document.getElementById('inviteSpotInfo').textContent = `Spot: ${name} (${wish})`;
  document.getElementById('inviteStart').value = '';
  document.getElementById('inviteEnd').value = '';
  document.getElementById('inviteModal').classList.add('show');
}

async function sendInvite() {
  if (!selectedInviteSpot) return;
  const start = new Date(document.getElementById('inviteStart').value).getTime();
  const end = new Date(document.getElementById('inviteEnd').value).getTime();
  if (!start || !end) return alert('Zeitraum wählen');
  const spot = allSpots.find(s => s.id === selectedInviteSpot.id);
  if (!spot) return;
  closeModals();
  try {
    await fetch(API+'/spotcache/invite', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({from:CODE, to:spot.code, spotId:spot.id, timeStart:start, timeEnd:end}) });
    alert('✅ Einladung gesendet');
  } catch(e) { alert('✅ Einladung gesendet (Demo)'); }
}

async function showInvites() {
  const btn = document.getElementById('inviteBtn');
  btn.classList.remove('alert'); btn.classList.add('secondary'); btn.textContent = '📨 Einladungen';

  let invites = [];
  try {
    const r = await fetch(API+'/spotcache/invites/'+CODE);
    if (r.ok) invites = await r.json();
  } catch(e) {
    invites = [
      { id:1, spotName:'Sonnenplatz', wishTag:'Kaffee', from:'222222', to:CODE, status:'pending', timeStart:Date.now()+3600000, timeEnd:Date.now()+7200000, lat:39.469, lng:-0.381 },
      { id:2, spotName:'Aussichtspunkt', wishTag:'Spaziergang', from:CODE, to:'333333', status:'accepted', timeStart:Date.now()-600000, timeEnd:Date.now()+3600000, lat:39.471, lng:-0.374 }
    ];
  }
  knownInviteCount = invites.length;
  const icEl = document.getElementById('inviteCount');
  if (icEl) icEl.textContent = invites.length;

  const list = invites.map(inv => {
    const isSender = inv.from === CODE;
    const isReceiver = inv.to === CODE;
    const status = getInviteStatus(inv);
    const timeStr = formatDateTime(inv.timeStart) + ' – ' + formatDateTime(inv.timeEnd);
    let actionButtons = '';

    const otherParty = isSender ? inv.to : inv.from;
    if (!isSender || isReceiver) {
      actionButtons += `<button class="si-btn" style="background:#7a8fa8;" onclick="showSpotOwnerProfile('${otherParty}')">👤 Profil</button>`;
    }

    if (isReceiver && inv.status === 'pending') {
      actionButtons += `<button class="si-btn accept" onclick="acceptInvite(${inv.id})">✅ Akzeptieren</button>`;
    }
    if (status.action === 'checkin') {
      actionButtons += `<button class="si-btn navigate" onclick="navigateToSpot(${inv.lat},${inv.lng})">🧭</button>`;
      actionButtons += `<button class="si-btn" onclick="checkIn(${inv.id})">📍 Check-in</button>`;
    }
    if (status.action === 'countdown') {
      actionButtons += `<span style="font-size:0.7rem;color:var(--muted);">${status.label}</span>`;
    }
    if (inv.status !== 'completed') {
      actionButtons += `<button class="si-btn cancel" onclick="cancelInvite(${inv.id}, ${isSender})">❌</button>`;
    }

    return `<div class="sheet-item">
      <div class="si-icon">${isSender ? '📤' : '📨'}</div>
      <div class="si-info">
        <div class="si-name">${esc(inv.spotName)} (${inv.wishTag})</div>
        <div class="si-detail">${timeStr}</div>
        <div class="si-detail">${status.label}</div>
      </div>
      <div class="si-actions">${actionButtons}</div>
    </div>`;
  }).join('') || '<p style="text-align:center;color:var(--muted);">Keine Einladungen</p>';
  openSheet('📨 Einladungen', list);
}

async function acceptInvite(id) {
  try { await fetch(API+'/spotcache/invite/respond', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, code:CODE, action:'accept'}) }); } catch(e){}
  showInvites();
}

// ════════ STORNO ════════
async function cancelInvite(inviteId, isSender) {
  if (!confirm('Einladung wirklich stornieren?')) return;
  try {
    if (isSender) {
      await fetch(API+'/spotcache/invite/delete/'+inviteId, { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE}) });
    } else {
      await fetch(API+'/spotcache/invite/respond', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:inviteId, code:CODE, action:'decline'}) });
    }
  } catch(e) {}
  showInvites();
}

// ════════ CHECK-IN ════════
async function checkIn(inviteId) {
  if (!navigator.geolocation) return alert('❌ Kein GPS verfügbar');
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const res = await fetch(API+'/spotcache/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:inviteId, code:CODE, lat:pos.coords.latitude, lng:pos.coords.longitude}) });
      const data = await res.json();
      if (data.error) return alert('⚠️ '+data.error);
      if (data.bothCheckedIn) {
        showMatchOverlay(inviteId);
      } else {
        alert('✅ Du bist eingecheckt!\n\nWarte auf deinen Treffpartner...');
      }
    } catch(e) {
      alert('✅ Eingecheckt (Demo) – warte auf den anderen...');
      setTimeout(() => showMatchOverlay(inviteId, true), 3000);
    }
    showInvites();
  }, () => alert('GPS nicht verfügbar'), { enableHighAccuracy: true });
}

async function showMatchOverlay(inviteId, demo = false) {
  let partnerName = 'Unbekannt', spotName = 'Spot', wishTag = '';
  if (!demo) {
    try {
      const r = await fetch(API+'/spotcache/invites/'+CODE);
      const invites = await r.json();
      const match = invites.find(i => i.id === inviteId);
      if (match) {
        partnerName = match.from === CODE ? maskCode(match.to) : maskCode(match.from);
        spotName = match.spotName;
        wishTag = match.wishTag;
      }
    } catch(e) {}
  } else {
    partnerName = 'Demo-Partner'; spotName = 'Demo-Spot';
  }
  document.getElementById('matchName').textContent = partnerName;
  document.getElementById('matchSpot').textContent = spotName + (wishTag ? ` · ${wishTag}` : '');
  document.getElementById('matchOverlay').classList.add('show');
}

function closeMatch() { document.getElementById('matchOverlay').classList.remove('show'); }

// ════════ HILFSFUNKTIONEN ════════
function getInviteStatus(inv) {
  const now = Date.now();
  const start = Number(inv.timeStart), end = Number(inv.timeEnd);
  if (inv.status === 'completed') return { label: '🎉 Getroffen!', action: null };
  if (inv.status === 'pending')   return { label: '⏳ Warte auf Antwort', action: null };
  if (inv.status === 'declined')  return { label: '❌ Abgelehnt', action: null };
  if (now < start) {
    const diff = start - now;
    const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
    return { label: h>0?`⏳ in ${h}h ${m}min`:`⏳ in ${m}min`, action: 'countdown' };
  }
  if (now >= start && now <= end) return { label: '🟢 Jetzt!', action: 'checkin' };
  return { label: '⏰ Abgelaufen', action: 'expired' };
}

function formatDateTime(ts) {
  const d = new Date(Number(ts));
  if (isNaN(d.getTime())) return 'Datum fehlt';
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

function maskCode(c) { return c?.slice(0,3)+'…'; }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showMySpots() {
  const list = mySpots.map(s=>`<div class="sheet-item"><div class="si-icon">🟠</div><div class="si-info"><div class="si-name">${esc(s.name)}</div><div class="si-detail">${s.wishTag}</div></div><div class="si-actions"><button class="si-btn navigate" onclick="navigateToSpot(${s.lat},${s.lng})">🧭</button><button class="si-btn" onclick="deleteSpot(${s.id})">🗑️</button></div></div>`).join('')||'<p style="text-align:center;color:var(--muted);">Keine Spots</p>';
  openSheet('🟠 Meine Spots', list);
}

function openSheet(title, content) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetContent').innerHTML = content;
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet() { document.getElementById('bottomSheet').classList.remove('open'); }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('show')); }

window.addEventListener('load', initMap);
</script>
