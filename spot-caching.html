<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpotMe · SpotCaching</title>
  <meta name="theme-color" content="#ff9a00">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #060a0f;
      --sur: #0c1219;
      --card: #101820;
      --card2: #141f2e;
      --bord: rgba(255,255,255,0.08);
      --acc: #ff9a00;
      --text: #dde4f0;
      --muted: #7a8fa8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 16px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .app-header {
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--sur);
      border-bottom: 1px solid var(--bord);
      flex-shrink: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--acc);
      margin-right: auto;
    }
    .logo span { font-weight: 300; opacity: 0.7; font-size: 0.8rem; }
    .header-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      margin-left: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-btn:active { background: rgba(255,154,0,0.15); border-color: var(--acc); }

    /* MAP */
    #map-container {
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    #map { width: 100%; height: 100%; }

    /* INFO BAR */
    .info-bar {
      display: flex;
      justify-content: space-around;
      padding: 0.4rem 0.5rem;
      background: var(--sur);
      border-top: 1px solid var(--bord);
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .info-bar span { color: var(--acc); font-weight: 700; }

    /* ACTION BAR */
    .action-bar {
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem;
      background: var(--sur);
      border-top: 1px solid var(--bord);
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .action-bar button {
      padding: 0.55rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--acc);
      background: var(--acc);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .action-bar button.secondary {
      background: transparent;
      color: var(--acc);
      border-color: rgba(255,154,0,0.3);
    }
    .action-bar button:active { opacity: 0.8; transform: scale(0.97); }

    /* BOTTOM SHEET */
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 45vh;
      background: var(--card);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--bord);
      padding: 0.8rem 1rem 2.5rem;
      overflow-y: auto;
      z-index: 500;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 0.6rem;
      cursor: pointer;
    }
    .sheet-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      color: var(--acc);
      margin-bottom: 0.6rem;
      text-align: center;
    }
    .sheet-item {
      background: var(--card2);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .sheet-item .si-icon { font-size: 1.5rem; }
    .sheet-item .si-info { flex: 1; }
    .sheet-item .si-name { font-weight: 600; font-size: 0.9rem; }
    .sheet-item .si-detail { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
    .sheet-item .si-btn {
      padding: 0.35rem 0.7rem;
      border-radius: 10px;
      border: none;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--acc);
    }
    .sheet-item .si-btn.accept { background: #1ecc68; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 600;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: var(--card);
      border-radius: 18px;
      padding: 1.2rem;
      width: 92%;
      max-width: 370px;
      border: 1px solid var(--bord);
      color: var(--text);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 8px; right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .finp {
      width: 100%;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
      background: var(--sur);
      border: 1px solid var(--bord);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }
    .finp:focus { border-color: var(--acc); }
    .form-label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
    .modal-btns { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    .modal-btns button { flex: 1; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="logo">SPOT<b>ME</b> <span>· Caching</span></div>
  <button class="header-btn" onclick="location.href='index.html'">‹</button>
  <button class="header-btn" onclick="location.href='profil-caching.html'">👤</button>
  <button class="header-btn" onclick="location.reload()">↺</button>
</header>

<div id="map-container"><div id="map"></div></div>

<div class="info-bar">
  <span id="spotCount">0</span> Spots ·
  <span id="inviteCount">0</span> Einladungen
</div>

<div class="action-bar" id="actionBar">
  <button onclick="startPlaceMode()">📍 Spot setzen</button>
  <button class="secondary" onclick="showMySpots()">🟠 Meine Spots</button>
  <button class="secondary" onclick="showInvites()">📨 Einladungen</button>
</div>

<!-- Bottom Sheet -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" onclick="closeSheet()"></div>
  <div class="sheet-title" id="sheetTitle">Titel</div>
  <div id="sheetContent"></div>
</div>

<!-- Spot Form Modal -->
<div class="modal-overlay" id="spotFormModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <h3 style="font-family:'Syne';color:var(--acc);text-align:center;margin-bottom:0.8rem;">📍 Spot anlegen</h3>
    <input id="spotName" class="finp" placeholder="Name (z.B. Schöner Brunnen)" maxlength="50">
    <input id="spotDesc" class="finp" placeholder="Beschreibung (optional)" maxlength="100">
    <label class="form-label">Wunsch-Tag:</label>
    <select id="spotWish" class="finp"></select>
    <div class="modal-btns">
      <button onclick="saveSpot()" style="background:var(--acc);color:#fff;">💾 Speichern</button>
      <button class="secondary" onclick="closeModals()" style="background:transparent;border:1px solid var(--bord);color:var(--muted);">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Invite Modal -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <h3 style="font-family:'Syne';color:var(--acc);text-align:center;margin-bottom:0.8rem;">📨 Einladung senden</h3>
    <input id="invitePartner" class="finp" placeholder="6-stelliger Partner-Code" maxlength="6">
    <label class="form-label">Zeitraum:</label>
    <input type="datetime-local" id="inviteStart" class="finp">
    <input type="datetime-local" id="inviteEnd" class="finp">
    <div class="modal-btns">
      <button onclick="sendInvite()" style="background:var(--acc);color:#fff;">Senden</button>
      <button class="secondary" onclick="closeModals()" style="background:transparent;border:1px solid var(--bord);color:var(--muted);">Abbrechen</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

const API = 'https://spotme-chat-obom.onrender.com/api';
const CODE = localStorage.getItem('sm_code') || '000000';

let map, userPos, placeMode = false, tempLatLng = null;
let mySpots = [];
let selectedSpotId = null;

// ════════════════ KARTE ════════════════
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([39.47, -0.38], 14);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OSM', maxZoom: 19
  }).addTo(map);

  navigator.geolocation?.getCurrentPosition(pos => {
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    L.marker([userPos.lat, userPos.lng], {
      icon: L.divIcon({ html: '<div style="background:#3b82f6;width:12px;height:12px;border-radius:50%;border:2px solid #fff;"></div>', iconSize: [16,16] })
    }).addTo(map).bindPopup('📍 Du').openPopup();
    map.setView([userPos.lat, userPos.lng], 15);
    fetch(API+'/location', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE, lat:userPos.lat, lng:userPos.lng, spot:'caching'}) }).catch(()=>{});
  });

  map.on('click', e => {
    if (placeMode) {
      tempLatLng = e.latlng;
      L.circleMarker([e.latlng.lat, e.latlng.lng], { radius:7, color:'#ff9a00', fillOpacity:0.6 }).addTo(map);
      placeMode = false;
      openSpotForm();
    }
  });

  loadMySpots();
}

// ════════════════ SPOTS ════════════════
function startPlaceMode() {
  placeMode = true;
  alert('📍 Tippe jetzt auf die Karte, wo dein Spot sein soll.');
}

function openSpotForm() {
  const profile = JSON.parse(localStorage.getItem('sm_profile_caching')||'{}');
  const wishes = profile.wishes?.length ? profile.wishes : ['Kaffee','Strand','Park'];
  document.getElementById('spotWish').innerHTML = wishes.map(w=>`<option value="${w}">${w}</option>`).join('');
  document.getElementById('spotName').value = '';
  document.getElementById('spotDesc').value = '';
  document.getElementById('spotFormModal').classList.add('show');
}

async function saveSpot() {
  const name = document.getElementById('spotName').value.trim();
  const desc = document.getElementById('spotDesc').value.trim();
  const wish = document.getElementById('spotWish').value;
  if (!name || !tempLatLng) return;
  const spot = { id: Date.now(), lat: tempLatLng.lat, lng: tempLatLng.lng, name, wishTag: wish };
  mySpots.push(spot);
  closeModals();
  loadMySpots();
  try {
    await fetch(API+'/userspots', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:CODE, ...spot, description:desc, wishTag:wish}) });
  } catch(e){}
}

async function loadMySpots() {
  try {
    const r = await fetch(API+'/userspots/'+CODE);
    if (r.ok) mySpots = await r.json();
  } catch(e) {
    if (!mySpots.length) mySpots = [
      { id:1, lat:39.472, lng:-0.376, name:'Strandbar', wishTag:'Strand' },
      { id:2, lat:39.468, lng:-0.380, name:'Café Central', wishTag:'Kaffee' }
    ];
  }
  document.getElementById('spotCount').textContent = mySpots.length;
  renderSpotMarkers();
}

function renderSpotMarkers() {
  map.eachLayer(l => { if (l.options?.className==='myspot') map.removeLayer(l); });
  mySpots.forEach(s => {
    const m = L.marker([s.lat, s.lng], {
      icon: L.divIcon({ html:'🟠', iconSize:[24,24], className:'myspot' })
    }).addTo(map);
    m.bindPopup(`<b>${esc(s.name)}</b><br>${s.wishTag}<br><button onclick="openInviteModal(${s.id})" style="margin-top:4px;padding:4px 10px;background:#ff9a00;border:none;border-radius:8px;color:#fff;cursor:pointer;">📨 Einladen</button>`);
    m.on('click',()=>m.openPopup());
  });
}

function showMySpots() {
  const list = mySpots.map(s=>`<div class="sheet-item"><div class="si-icon">🟠</div><div class="si-info"><div class="si-name">${esc(s.name)}</div><div class="si-detail">${s.wishTag}</div></div><button class="si-btn" onclick="openInviteModal(${s.id})">📨</button></div>`).join('')||'<p style="text-align:center;color:var(--muted);">Keine Spots</p>';
  openSheet('🟠 Meine Spots', list);
}

// ════════════════ EINLADUNGEN ════════════════
function openInviteModal(spotId) {
  selectedSpotId = spotId;
  document.getElementById('invitePartner').value = '';
  document.getElementById('inviteStart').value = '';
  document.getElementById('inviteEnd').value = '';
  document.getElementById('inviteModal').classList.add('show');
}

async function sendInvite() {
  const to = document.getElementById('invitePartner').value.trim();
  const start = new Date(document.getElementById('inviteStart').value).getTime();
  const end = new Date(document.getElementById('inviteEnd').value).getTime();
  if (!to || to.length!==6 || !start || !end) return alert('Bitte alle Felder korrekt ausfüllen');
  closeModals();
  try {
    await fetch(API+'/spotcache/invite', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({from:CODE, to, spotId:selectedSpotId, timeStart:start, timeEnd:end}) });
    alert('✅ Einladung gesendet');
  } catch(e) { alert('✅ Einladung gesendet (Demo)'); }
}

async function showInvites() {
  let invites = [];
  try {
    const r = await fetch(API+'/spotcache/invites/'+CODE);
    if (r.ok) invites = await r.json();
  } catch(e) {
    invites = [{ id:1, spotName:'Café Central', wishTag:'Kaffee', from:'123456', status:'pending', timeStart:Date.now()+3600000, timeEnd:Date.now()+7200000 }];
  }
  document.getElementById('inviteCount').textContent = invites.length;
  const list = invites.map(inv=>`<div class="sheet-item"><div class="si-icon">📨</div><div class="si-info"><div class="si-name">${esc(inv.spotName)} (${inv.wishTag})</div><div class="si-detail">${inv.status==='pending'?'Warte auf Antwort':inv.status}</div></div>${inv.status==='pending'&&inv.to===CODE?`<button class="si-btn accept" onclick="acceptInvite(${inv.id})">✅</button>`:''}${inv.status==='accepted'?`<button class="si-btn" onclick="checkIn(${inv.id})">📍 Check-in</button>`:''}</div>`).join('')||'<p style="text-align:center;color:var(--muted);">Keine Einladungen</p>';
  openSheet('📨 Einladungen', list);
}

async function acceptInvite(id) {
  try { await fetch(API+'/spotcache/invite/respond', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, code:CODE, action:'accept'}) }); } catch(e){}
  showInvites();
}

function checkIn(inviteId) {
  navigator.geolocation?.getCurrentPosition(async pos => {
    try {
      const r = await fetch(API+'/spotcache/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:inviteId, code:CODE, lat:pos.coords.latitude, lng:pos.coords.longitude}) });
      const d = await r.json();
      alert(d.bothCheckedIn ? '🎉 Ihr habt euch gefunden!' : '✅ Eingecheckt – warte auf den anderen.');
    } catch(e) { alert('Check-in (Demo) – am Spot angekommen!'); }
    showInvites();
  });
}

// ════════════════ UI ════════════════
function openSheet(title, content) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetContent').innerHTML = content;
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet() { document.getElementById('bottomSheet').classList.remove('open'); }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('show')); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
window.addEventListener('load', initMap);
</script>
</body>
</html>
