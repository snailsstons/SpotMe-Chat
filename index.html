<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotMe · Messenger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060a0f">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOCAL‑MODE BANNER -->
<div id="local-mode-banner" class="local-banner" style="display: none;">
  <span>📴</span>
  <span>Lokaler Modus – Nachrichten werden gespeichert und später gesendet</span>
</div>

<!-- SCREEN 1 – HOME (Kontaktliste + Neuer Chat) -->
<div id="s-home" class="screen active">
  <header class="app-header">
    <div class="header-left"></div>
    <div class="logo">SPOT<b>ME</b></div>
    <div class="header-right">
      <div class="status-badge" id="header-status">● ONLINE</div>
      <button class="home-menu-btn" onclick="toggleHomeMenu(event)">⋮</button>
      <div class="home-drop" id="home-drop">
        <button class="sitem" onclick="showBackupPasswordModal()">💾 Profil sichern</button>
        <button class="sitem" onclick="document.getElementById('restore-inp').click()">📂 Wiederherstellen</button>
        <input type="file" id="restore-inp" accept=".json" style="display:none" onchange="restoreProfile(this)">
        <button class="sitem" onclick="window.location.href='profil.html'">👤 Mein Profil</button>
        <button class="sitem" onclick="window.location.href='awareness.html'">🧘 Achtsamkeit</button>
        <button class="sitem" onclick="window.location.href='spot.html'">👥 Spot · Community</button>
        <button class="sitem" onclick="window.location.href='portfolio.html'">🖼️ Portfolio</button>
      </div>
    </div>
  </header>

  <div class="home-content">
    <!-- Eigener Code -->
    <div class="code-card-new">
      <div class="code-label">Dein Code</div>
      <div class="code-value" id="mycode">--- ---</div>
      <div class="code-actions">
        <button class="csbtn-new" onclick="copyCode()">📋 Kopieren</button>
        <button class="csbtn-new csbtn-primary" onclick="shareCode()">↗️ Teilen</button>
      </div>
    </div>

    <!-- Kontaktliste (Letzte Chats + Offline-Nachrichten) -->
    <div id="psec">
      <div class="section-header">
        <span class="section-label">Chats</span>
        <button class="missed-clear-btn" onclick="renderPrev()">↻</button>
      </div>
      <div id="plist" class="contact-list"></div>
    </div>

    <!-- Neuen Chat starten -->
    <div class="conn-box-new">
      <div class="conn-label">Neue Nachricht</div>
      <div class="drow-new">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn-main-new" id="cbtn" onclick="connectToPeer()" disabled>💬 Chat starten</button>
    </div>
  </div>
</div>

<!-- SCREEN 2 – CHAT (P2P, nur bei Online‑Verbindung) -->
<div id="s-chat" class="screen">
  <div class="chat-bar">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="peer-wrap">
      <div class="pav offline" id="pav">🧑</div>
      <div class="pinfo">
        <div class="pname" id="pname">...</div>
        <div class="pstatus dim" id="pstatus">○ Verbinde...</div>
      </div>
    </div>
    <button class="album-btn" onclick="showAlbumMenu()" title="Alben">🖼️</button>
    <button class="location-btn" onclick="openLocationScreen()" title="Treffpunkt">📍</button>
    <button class="menu-btn" onclick="openSheet()">☰</button>
  </div>
  <div class="rcbar" id="rcbar"><span>○ Verbindung unterbrochen</span><button class="rc-btn" onclick="tryReconnect()">↺ Erneut verbinden</button></div>
  <div class="messages" id="messages"><div class="empty-chat" id="ehint"><div class="empty-icon">💬</div><div class="empty-txt">Verbindung wird aufgebaut...</div></div></div>
  <div class="icont"><div class="upbar-wrap" id="upw"><div class="upbar" id="upb"></div></div><div class="ibar">
    <button class="attach-btn" onclick="document.getElementById('finp').click()" title="Datei">📎</button>
    <input type="file" id="finp" style="display:none" onchange="sendFile(this)">
    <button class="voice-btn" id="voice-btn" onclick="toggleVoiceRecording()" title="Sprachnachricht" style="display:none;">🎤</button>
    <textarea class="minp" id="minp" placeholder="Nachricht..." rows="1" oninput="autoH(this)" onkeydown="hkey(event)"></textarea>
    <button class="send-btn" id="sbtn" onclick="sendMsg()" disabled>➤</button>
  </div></div>
</div>

<!-- Alle bestehenden Modale und Sheets bleiben unverändert -->

<!-- ═══════════════════════════════════════════════════════════════════════════
     MODULE (wie gehabt)
═══════════════════════════════════════════════════════════════════════════ -->
<script src="scripts/config.js"></script>
<script src="scripts/utils.js"></script>
<script src="scripts/usage-stats.js"></script>
<script src="scripts/storage.js"></script>
<script src="scripts/ui-core.js"></script>
<script src="scripts/audio.js"></script>
<script src="scripts/traffic.js"></script>
<script src="scripts/p2p-core.js"></script>
<script src="scripts/ui-home.js"></script>
<script src="scripts/p2p-call.js"></script>
<script src="scripts/p2p-message.js"></script>
<script src="scripts/p2p-file.js"></script>
<script src="scripts/p2p-location.js"></script>
<script src="scripts/albums.js"></script>
<script src="scripts/backup.js"></script>
<script src="scripts/voice.js"></script>
<script src="scripts/ui-chat.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
