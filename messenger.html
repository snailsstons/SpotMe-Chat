<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Eruda – Mobile Console (nur für Debugging) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotMe · Messenger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060a0f">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Versteckte Dummy-Elemente für ui-chat.js */
    #upw, #upb, .album-btn, .location-btn, .attach-btn, #finp, #voice-btn { display: none !important; }
  </style>
</head>
<body>

<!-- LOCAL‑MODE BANNER -->
<div id="local-mode-banner" class="local-banner" style="display: none;">
  <span>📴</span>
  <span>Lokaler Modus – Nachrichten werden gespeichert und später gesendet</span>
</div>

<!-- SCREEN 1 – HOME (Kontaktliste) -->
<div id="s-home" class="screen active">
  <header class="app-header">
    <div class="header-left"></div>
    <div class="logo">SPOT<b>ME</b></div>
    <div class="header-right">
      <div class="status-badge" id="header-status">● ONLINE</div>
    </div>
  </header>

  <div class="home-content">
    <!-- Eigener Code -->
    <div class="code-card-new">
      <div class="code-label">Dein Code</div>
      <div class="code-value" id="mycode">--- ---</div>
      <div class="code-actions">
        <button class="csbtn-new" onclick="copyCode()">📋 Kopieren</button>
        <button class="csbtn-new csbtn-primary" onclick="shareCode()">↗️ Teilen</button>
      </div>
    </div>

    <!-- Kontaktliste (Letzte Chats) -->
    <div id="psec">
      <div class="section-header">
        <span class="section-label">Chats</span>
      </div>
      <div id="plist" class="contact-list"></div>
    </div>

    <!-- Neuen Kontakt hinzufügen -->
    <div class="conn-box-new">
      <div class="conn-label">Neuer Chat</div>
      <div class="drow-new">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn-main-new" id="cbtn" onclick="connectToPeer()" disabled>💬 Chat starten</button>
    </div>
  </div>
</div>

<!-- SCREEN 2 – CHATANFRAGE -->
<div id="s-in" class="screen">
  <div class="call-wrap">
    <div class="caller-ring">🧑</div>
    <div class="caller-name" id="in-name">...</div>
    <div class="caller-code" id="in-code">Code: ---</div>
    <div class="caller-hint">möchte mit dir chatten</div>
    <div class="call-btns">
      <button class="call-btn btn-decline" onclick="declineCall()">✕ Ablehnen</button>
      <button class="call-btn btn-accept" onclick="acceptCall()">✓ Annehmen</button>
    </div>
  </div>
</div>

<!-- SCREEN 3 – CHAT -->
<div id="s-chat" class="screen">
  <div class="chat-bar">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="peer-wrap">
      <div class="pav offline" id="pav">🧑</div>
      <div class="pinfo">
        <div class="pname" id="pname">...</div>
        <div class="pstatus dim" id="pstatus">○ Verbinde...</div>
      </div>
    </div>
    <!-- Dummy-Buttons für ui-chat.js -->
    <button class="album-btn" style="display:none;"></button>
    <button class="location-btn" style="display:none;"></button>
    <button class="menu-btn" onclick="openSheet()">☰</button>
  </div>
  <div class="rcbar" id="rcbar">
    <span>○ Verbindung unterbrochen</span>
    <button class="rc-btn" onclick="tryReconnect()">↺ Erneut verbinden</button>
  </div>
  <div class="messages" id="messages">
    <div class="empty-chat" id="ehint">
      <div class="empty-icon">💬</div>
      <div class="empty-txt">Verbindung wird aufgebaut...</div>
    </div>
  </div>
  <!-- Dummy-Elemente für Datei-Upload -->
  <div class="upbar-wrap" id="upw" style="display:none;"><div class="upbar" id="upb"></div></div>
  <input type="file" id="finp" style="display:none">
  <div class="icont">
    <div class="ibar">
      <button class="attach-btn" style="display:none;"></button>
      <button class="voice-btn" id="voice-btn" style="display:none;"></button>
      <textarea class="minp" id="minp" placeholder="Nachricht..." rows="1" oninput="autoH(this)" onkeydown="hkey(event)"></textarea>
      <button class="send-btn" id="sbtn" onclick="sendMsg()" disabled>➤</button>
    </div>
  </div>
</div>

<!-- Chat-Optionen (Sheet) -->
<div class="sheet-ovl" id="sovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Chat-Optionen</div>
  <div class="sheet-body">
    <button class="sitem" onclick="renamePartner()"><div class="sico">✏️</div><div class="slab"><div>Partner umbenennen</div></div></button>
    <div class="ssep"></div>
    <button class="sitem" onclick="closeSheet(); clearChat()"><div class="sico">🗑️</div><div class="slab"><div>Verlauf löschen</div></div></button>
    <div class="ssep"></div>
    <button class="sitem" onclick="closeSheet(); goHome()"><div class="sico">✕</div><div class="slab"><div>Chat beenden</div></div></button>
  </div>
</div>

<!-- Info Modal (wird für Bestätigungen verwendet) -->
<div id="info-modal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:320px; text-align:center;">
    <h3 id="info-modal-title"></h3>
    <p id="info-modal-message" style="margin:16px 0; color:var(--text-dim);"></p>
    <button id="info-modal-ok" class="btn-primary" style="width:100%;">OK</button>
  </div>
</div>

<!-- In-App Notification -->
<div class="in-notif" id="in-notif" onclick="switchToChat()">
  <div class="in-ico">💬</div>
  <div><div class="in-from" id="in-from">...</div><div class="in-msg" id="in-msg">...</div></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     MODULE (aus /scripts/)
═══════════════════════════════════════════════════════════════════════════ -->
<script src="scripts/config.js"></script>
<script src="scripts/utils.js"></script>
<script src="scripts/storage.js"></script>
<script src="scripts/ui-core.js"></script>
<script src="scripts/audio.js"></script>
<script src="scripts/p2p-core.js"></script>
<script src="scripts/p2p-message.js"></script>
<script src="scripts/ui-chat.js"></script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     MESSENGER-SPEZIFISCHE ANPASSUNGEN (LOCAL‑FIRST OHNE NERVIGE MODALE)
═══════════════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// 1. Stille Pending‑Nachrichten (keine Modale beim Schreiben)
//    Wir überschreiben addPendingMessage und flushPendingMessages aus storage.js
// ─────────────────────────────────────────────────────────────────────────────
const _originalAddPending = window.addPendingMessage;
window.addPendingMessage = function(text) {
  // Originalfunktion aufrufen (fügt Nachricht hinzu und zeigt Modal)
  // Aber wir wollen das Modal unterdrücken! Also temporär showInfoModal deaktivieren.
  const originalShow = window.showInfoModal;
  window.showInfoModal = function() {}; // Dummy
  
  _originalAddPending(text);
  
  window.showInfoModal = originalShow; // Wiederherstellen
};

const _originalFlush = window.flushPendingMessages;
window.flushPendingMessages = function() {
  if (!conn || !conn.open) return;
  if (pendingMessages.length === 0) return;
  const toSend = [...pendingMessages];
  clearPendingMessages();
  for (let msg of toSend) {
    const m = { t: 'text', text: msg.text, ts: msg.ts };
    conn.send(m);
    appendMsg({ ...m, own: true });
    persistMsg({ ...m, own: true });
  }
  // KEIN MODAL – wir sammeln die Bestätigung später
};

// Speicher für die Anzahl der gesendeten Pending‑Nachrichten
let pendingSendCount = 0;

// Beim erfolgreichen Senden einer Nachricht aus der Queue erhöhen wir den Zähler
const _originalSendMsg = window.sendMsg;
window.sendMsg = function() {
  const inp = document.getElementById('minp');
  const text = inp.value.trim();
  if (!text) return;

  if (!conn || !conn.open) {
    if (!chatId) {
      toast('⚠️ Bitte zuerst eine Verbindung aufbauen');
      return;
    }
    addPendingMessage(text);
    // Sofort im Chat anzeigen
    const m = { t: 'text', text, ts: Date.now(), own: true };
    appendMsg(m);
    persistMsg(m);
    inp.value = '';
    inp.style.height = 'auto';
    return;
  }

  // Online – normal senden
  _originalSendMsg.call(this);
};

// Überschreiben von openChat, um bei Verbindungsaufbau die Queue zu flushen und zu zählen
const _originalOpenChat = window.openChat;
window.openChat = function(c) {
  // Wenn wir von null auf echte Verbindung wechseln, merken wir uns die aktuelle Queue-Größe
  if (c && !conn) {
    pendingSendCount = pendingMessages.length;
  }
  _originalOpenChat.call(this, c);
  
  // Wenn nach dem Öffnen die Verbindung steht, zeigen wir EIN Modal mit der Anzahl
  if (c && conn && conn.open && pendingSendCount > 0) {
    setTimeout(() => {
      showInfoModal(
        '✅ Nachrichten gesendet',
        `${pendingSendCount} ${pendingSendCount === 1 ? 'Nachricht' : 'Nachrichten'} erfolgreich gesendet.`,
        'OK'
      );
      pendingSendCount = 0;
    }, 500);
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// 2. Beim Verlassen des Chats: Wenn Pending‑Nachrichten existieren, einmalig bestätigen
// ─────────────────────────────────────────────────────────────────────────────
const _originalGoHome = window.goHome;
window.goHome = function() {
  const pending = pendingMessages.length;
  if (pending > 0 && conn && !conn.open) {
    // Wir sind im Lokal‑Modus und haben ungesendete Nachrichten
    showInfoModal(
      '📦 Lokal gespeichert',
      `${pending} ${pending === 1 ? 'Nachricht wird' : 'Nachrichten werden'} gesendet, sobald du wieder online bist.`,
      'Verstanden'
    );
  }
  
  // Original goHome ausführen (Verbindung trennen, Screen wechseln)
  if (conn) { try { conn.close(); } catch(e) {} conn = null; }
  pendingConn = null;
  document.querySelectorAll('.dinp-new').forEach(d => { d.value = ''; d.classList.remove('filled'); });
  document.getElementById('cbtn').disabled = true;
  renderPrev();
  showScreen('s-home');
};

// ─────────────────────────────────────────────────────────────────────────────
// 3. Fehlende globale Funktionen definieren
// ─────────────────────────────────────────────────────────────────────────────
window.markAutoReconnect = function() {
  console.log('🏷️ markAutoReconnect (Messenger)');
  if (typeof autoReconnectPending !== 'undefined') autoReconnectPending = true;
};

// Dummy-Funktionen für nicht benötigte Features
window.showAlbumMenu = function() { toast('Alben im Messenger nicht verfügbar'); };
window.openLocationScreen = function() { toast('Standort im Messenger nicht verfügbar'); };
window.toggleVoiceRecording = function() { toast('Sprachnachrichten im Messenger nicht verfügbar'); };
window.sendFile = function() { toast('Dateien im Messenger nicht verfügbar'); };

// ─────────────────────────────────────────────────────────────────────────────
// 4. Robustes Info-Modal (OK-Button funktioniert garantiert)
// ─────────────────────────────────────────────────────────────────────────────
window.showInfoModal = function(title, message, buttonText = 'OK') {
  let modal = document.getElementById('info-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'info-modal';
    modal.className = 'modal';
    modal.style.display = 'none';
    modal.innerHTML = `
      <div class="modal-content" style="max-width:320px; text-align:center;">
        <h3 id="info-modal-title"></h3>
        <p id="info-modal-message" style="margin:16px 0; color:var(--text-dim);"></p>
        <button id="info-modal-ok" class="btn-primary" style="width:100%;">OK</button>
      </div>
    `;
    document.body.appendChild(modal);
    
    const okBtn = modal.querySelector('#info-modal-ok');
    okBtn.addEventListener('click', function() {
      modal.style.display = 'none';
    });
    
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.style.display = 'none';
    });
  }
  
  document.getElementById('info-modal-title').textContent = title;
  document.getElementById('info-modal-message').textContent = message;
  const okBtn = document.getElementById('info-modal-ok');
  okBtn.textContent = buttonText;
  modal.style.display = 'flex';
};

// ─────────────────────────────────────────────────────────────────────────────
// 5. Messenger‑spezifische UI‑Funktionen
// ─────────────────────────────────────────────────────────────────────────────
function initDigits() {
  const inps = document.querySelectorAll('.dinp-new');
  inps.forEach((p, i) => {
    p.addEventListener('input', () => {
      const v = p.value.replace(/\D/g, '');
      p.value = v ? v.slice(-1) : '';
      p.classList.toggle('filled', !!p.value);
      if (p.value && i < 5) inps[i + 1].focus();
      document.getElementById('cbtn').disabled = getDigits().length !== 6;
    });
    p.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !p.value && i > 0) {
        inps[i - 1].value = ''; inps[i - 1].classList.remove('filled');
        inps[i - 1].focus(); document.getElementById('cbtn').disabled = true;
      }
    });
    p.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      txt.split('').forEach((ch, j) => {
        if (inps[i + j]) { inps[i + j].value = ch; inps[i + j].classList.add('filled'); }
      });
      inps[Math.min(i + txt.length, 5)].focus();
      document.getElementById('cbtn').disabled = getDigits().length !== 6;
    });
  });
}
function getDigits() { return [...document.querySelectorAll('.dinp-new')].map(x => x.value).join(''); }

function copyCode() {
  navigator.clipboard.writeText(myCode).then(() => toast('✅ Code kopiert')).catch(() => toast('Code: ' + myCode));
}
function shareCode() {
  const url = `${window.location.origin}${window.location.pathname}?code=${myCode}`;
  if (navigator.share) navigator.share({ title: 'SpotMe', text: `Mein Code: ${formatCode(myCode)}`, url });
  else copyCode();
}

function renderPrev() {
  const arr = JSON.parse(localStorage.getItem('sm_idx') || '[]');
  const lst = document.getElementById('plist');
  if (!arr.length) {
    lst.innerHTML = '<div class="empty-state">Noch keine Chats</div>';
    return;
  }
  lst.innerHTML = arr.map(c => {
    const alias = getContacts()[c.code] || c.partner;
    return `<div class="chat-card" onclick="reconnectTo('${c.code}','${esc2(alias)}','${c.id}')">
      <div class="card-row">
        <div class="card-avatar">🧑</div>
        <div class="card-details">
          <div class="card-name">${esc(alias)}</div>
          <div class="card-preview">${esc(c.preview || '—')}</div>
        </div>
      </div>
      <div class="card-meta">
        <span class="card-time">${timeAgo(c.ts)}</span>
        <span class="card-code">${formatCode(c.code)}</span>
      </div>
    </div>`;
  }).join('');
}

function reconnectTo(code, name, cid) {
  partnerCode = code; partnerName = name; chatId = cid;
  loadPendingMessages(); migratePendingMessages(chatId);
  openChat(peerReady ? peer.connect(code, { reliable: true, metadata: { name: myName } }) : null);
}

function connectToPeer() {
  const code = getDigits();
  if (code.length !== 6 || code === myCode) return;
  partnerCode = code; partnerName = localName(code); chatId = buildCID(myCode, code);
  loadPendingMessages(); migratePendingMessages(chatId);
  openChat(null);
  if (peerReady) {
    const newConn = peer.connect(code, { reliable: true, metadata: { name: myName } });
    openChat(newConn);
  } else {
    markAutoReconnect();
  }
}

function acceptCall() {
  stopRingingTone();
  if (!pendingConn) return;
  const c = pendingConn; pendingConn = null;
  partnerCode = c.peer; partnerName = localName(c.peer, c.metadata?.name);
  chatId = buildCID(myCode, partnerCode);
  loadPendingMessages(); migratePendingMessages(chatId);
  openChat(c);
}

function declineCall() {
  stopRingingTone();
  if (pendingConn) {
    const c = pendingConn; pendingConn = null;
    addMissed(c.peer, localName(c.peer, c.metadata?.name));
    try { c.close(); } catch(e) {}
  }
  showScreen('s-home');
}

function clearChat() {
  if (!chatId) return;
  localStorage.removeItem('smmsg_' + chatId);
  const idx = JSON.parse(localStorage.getItem('sm_idx') || '[]');
  localStorage.setItem('sm_idx', JSON.stringify(idx.filter(c => c.id !== chatId)));
  document.getElementById('messages').innerHTML = '<div class="empty-chat"><div class="empty-icon">🗑️</div><div class="empty-txt">Verlauf gelöscht.</div></div>';
  renderPrev();
  toast('🗑️ Verlauf gelöscht');
}

// ─────────────────────────────────────────────────────────────────────────────
// 6. Initialisierung
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  document.getElementById('mycode').textContent = myCode.slice(0,3) + ' · ' + myCode.slice(3,6);
  initDigits();
  renderPrev();
  initPeer();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();

  const params = new URLSearchParams(window.location.search);
  const autoCode = params.get('code');
  if (autoCode && autoCode.length === 6) {
    const inps = document.querySelectorAll('.dinp-new');
    autoCode.split('').forEach((ch, i) => { if (inps[i]) { inps[i].value = ch; inps[i].classList.add('filled'); } });
    document.getElementById('cbtn').disabled = false;
    connectToPeer();
  }

  const stored = sessionStorage.getItem('sm_connect_to');
  if (stored && peer) {
    sessionStorage.removeItem('sm_connect_to');
    setTimeout(() => {
      const inps = document.querySelectorAll('.dinp-new');
      stored.split('').forEach((ch, i) => { if (inps[i]) { inps[i].value = ch; inps[i].classList.add('filled'); } });
      document.getElementById('cbtn').disabled = false;
      connectToPeer();
    }, 1500);
  }
});

const style = document.createElement('style');
style.textContent = `
  .contact-list { display: flex; flex-direction: column; gap: 8px; }
  .empty-state { text-align: center; padding: 24px; color: var(--text-dim); }
`;
document.head.appendChild(style);
</script>
</body>
  </html>
