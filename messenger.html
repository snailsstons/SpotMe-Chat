<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotMe – Lokaler Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Syne', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1a1a1a;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #ff4f7b;
    }
    .info {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 1rem;
    }
    #setup, #chat { display: none; }
    #setup.active, #chat.active { display: block; }
    label {
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4f7b;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e0456b; }
    .dual {
      display: flex;
      gap: 0.5rem;
    }
    .dual input { flex: 1; }
    #messages {
      height: 50vh;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding: 0.5rem;
      background: #111;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .msg.mine {
      align-self: flex-end;
      background: #ff4f7b;
      color: #fff;
    }
    .msg.other {
      align-self: flex-start;
      background: #2a2a2a;
    }
    .msg .author {
      font-weight: bold;
      font-size: 0.75rem;
      display: block;
      margin-bottom: 0.2rem;
      color: #aaa;
    }
    .msg.mine .author { color: #ffe0e0; }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    .input-row input {
      flex: 1;
      margin-bottom: 0;
    }
    .input-row button {
      width: auto;
      padding: 0.75rem 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💬 Lokaler Messenger</h2>
    <p class="info">Kein Server · Nur du & dein Chatpartner</p>

    <!-- Setup -->
    <div id="setup" class="active">
      <label for="myCode">Dein 6‑stelliger Code</label>
      <input type="text" id="myCode" maxlength="6" placeholder="z. B. 565116">
      
      <label for="partnerCode">Code des Chatpartners</label>
      <input type="text" id="partnerCode" maxlength="6" placeholder="z. B. 845974">
      
      <button onclick="initChat()">💬 Chat starten</button>
    </div>

    <!-- Chat -->
    <div id="chat">
      <p class="info" id="roomInfo"></p>
      <div id="messages"></div>
      <div class="input-row">
        <input type="text" id="inputMsg" placeholder="Nachricht..." autofocus>
        <button onclick="sendMsg()">➤</button>
      </div>
      <button onclick="leaveChat()" style="margin-top:1rem; background:#444;">← Anderen Chatpartner wählen</button>
    </div>
  </div>

  <script>
    const STORAGE_PREFIX = 'sm_local_msg_';
    let currentRoom = null;
    let myCode = null;
    let partnerCode = null;
    let bc = null;

    // Initialisierung
    function initChat() {
      myCode = document.getElementById('myCode').value.trim();
      partnerCode = document.getElementById('partnerCode').value.trim();

      if (myCode.length !== 6 || partnerCode.length !== 6) {
        alert('Beide Codes müssen 6‑stellig sein.');
        return;
      }

      if (myCode === partnerCode) {
        alert('Chat mit dir selbst ist nicht möglich.');
        return;
      }

      // Raum-Schlüssel: sortierte Codes
      const codes = [myCode, partnerCode].sort();
      currentRoom = codes[0] + '-' + codes[1];

      document.getElementById('roomInfo').textContent = `Raum: ${currentRoom}`;
      document.getElementById('setup').classList.remove('active');
      document.getElementById('chat').classList.add('active');

      // Broadcast Channel für tab-übergreifende Echtzeit
      if (bc) bc.close();
      bc = new BroadcastChannel(currentRoom);
      bc.onmessage = (e) => {
        if (e.data && e.data.type === 'new_msg') renderMessages();
      };

      renderMessages();
      document.getElementById('inputMsg').focus();
    }

    // Nachrichten laden
    function getMessages() {
      const raw = localStorage.getItem(STORAGE_PREFIX + currentRoom);
      return raw ? JSON.parse(raw) : [];
    }

    // Nachrichten speichern
    function saveMessages(msgs) {
      localStorage.setItem(STORAGE_PREFIX + currentRoom, JSON.stringify(msgs));
    }

    // Rendern
    function renderMessages() {
      const msgs = getMessages();
      const container = document.getElementById('messages');
      container.innerHTML = msgs.map(m => {
        const isMine = m.from === myCode;
        return `<div class="msg ${isMine ? 'mine' : 'other'}">
          <span class="author">${esc(isMine ? 'Du' : maskCode(m.from))}</span>
          ${esc(m.text)}
          <div style="font-size:0.65rem;opacity:0.5;margin-top:0.2rem;">${new Date(m.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    // Senden
    function sendMsg() {
      const input = document.getElementById('inputMsg');
      const text = input.value.trim();
      if (!text) return;
      const msgs = getMessages();
      msgs.push({ from: myCode, text, ts: Date.now() });
      saveMessages(msgs);
      input.value = '';
      renderMessages();
      // Tab-übergreifend benachrichtigen
      if (bc) bc.postMessage({ type: 'new_msg' });
    }

    // Verlassen
    function leaveChat() {
      if (bc) bc.close();
      bc = null;
      currentRoom = null;
      document.getElementById('chat').classList.remove('active');
      document.getElementById('setup').classList.add('active');
      document.getElementById('myCode').value = '';
      document.getElementById('partnerCode').value = '';
    }

    // Helfer
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function maskCode(c) {
      return c ? c.slice(0,3) + '…' : '???';
    }

    // Enter im Input
    document.getElementById('inputMsg').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
  </html>
