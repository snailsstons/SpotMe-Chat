<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotMe – Messenger (P2P)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Syne', 'DM Sans', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1a1a1a;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      margin-bottom: 0.25rem;
      color: #ff4f7b;
      font-weight: 800;
    }
    .info {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 1.25rem;
    }
    .section-title {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
      border: 1px solid #333;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: #ff4f7b; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4f7b;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e0456b; }
    button.secondary { background: #2a2a2a; color: #eee; }
    .invite-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .invite-row input { flex: 1; margin-bottom: 0; }
    .invite-row button { width: auto; padding: 0.75rem 1.2rem; }
    #invites-container { margin-bottom: 1rem; }
    .invite-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #222;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      margin-bottom: 0.4rem;
    }
    .invite-item span { font-weight: 600; }
    .invite-item button {
      width: auto;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
    }
    #chat-area { display: none; }
    #chat-area.active { display: block; }
    #setup-area { display: block; }
    #setup-area.hidden { display: none; }
    #messages {
      height: 50vh;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding: 0.5rem;
      background: #111;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.9rem;
      word-break: break-word;
      animation: pop 0.2s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg-bubble.mine {
      align-self: flex-end;
      background: #ff4f7b;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble.other {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
    }
    .msg-author {
      font-weight: 700;
      font-size: 0.7rem;
      display: block;
      margin-bottom: 0.2rem;
      opacity: 0.8;
    }
    .msg-time {
      font-size: 0.65rem;
      opacity: 0.5;
      margin-top: 0.2rem;
      text-align: right;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    .input-row input { flex: 1; margin-bottom: 0; }
    .input-row button { width: auto; padding: 0.75rem 1.25rem; }
    .return-btn {
      margin-top: 0.8rem;
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      font-size: 0.85rem;
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 0.3rem;
      background: #666;
    }
    .status-dot.connected { background: #4caf50; }
    .status-dot.disconnected { background: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h2>💬 Messenger (P2P)</h2>
    <p class="info" id="status-info">Direktverbindung über WebRTC</p>

    <div id="setup-area">
      <div class="section-title">📨 Einladungen an dich:</div>
      <div id="invites-container">
        <p style="color:#666;font-size:0.85rem;text-align:center;">Keine offenen Einladungen</p>
      </div>
      
      <div class="section-title" style="margin-top:1rem;">Neuen Chat starten:</div>
      <div class="invite-row">
        <input type="text" id="partnerCodeInput" maxlength="6" placeholder="6‑stelliger Code">
        <button onclick="sendInvite()">💬 Einladen</button>
      </div>
    </div>

    <div id="chat-area">
      <p class="info" id="roomInfo"></p>
      <div style="display:flex;align-items:center;margin-bottom:0.5rem;">
        <span class="status-dot" id="connection-dot"></span>
        <span style="font-size:0.8rem;color:#aaa;" id="connection-label">Verbinde...</span>
      </div>
      <div id="messages"></div>
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="Nachricht..." autofocus>
        <button onclick="sendMsg()">➤</button>
      </div>
      <button class="return-btn" onclick="resetToSetup()">← Zurück zu Einladungen</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script>
    const API_BASE = 'https://spotme-chat-obom.onrender.com/api';
    const MSG_PREFIX = 'sm_local_msg_';

    let myCode = '';
    let chatRoom = '';
    let partnerCode = '';
    let peer = null;
    let conn = null;
    let pollTimer = null;

    // ── Initialisierung ──────────────────────────────────────────────────
    async function init() {
      myCode = localStorage.getItem('sm_code');
      if (!myCode) {
        document.getElementById('status-info').textContent = '⚠️ Kein Code – bitte im Spot veröffentlichen';
        return;
      }
      document.getElementById('status-info').textContent = 'Dein Code: ' + myCode;

      const urlParams = new URLSearchParams(location.search);
      const partnerFromUrl = urlParams.get('partner');
      if (partnerFromUrl && partnerFromUrl.length === 6 && partnerFromUrl !== myCode) {
        document.getElementById('partnerCodeInput').value = partnerFromUrl;
        sendInvite(); // direkt einladen
      }

      await loadInvites();
      startInvitePolling();
    }

    // ── Einladungen (Server) ─────────────────────────────────────────────
    async function loadInvites() {
      try {
        const res = await fetch(`${API_BASE}/invites/${myCode}`);
        if (!res.ok) return;
        const invites = await res.json();
        renderInvites(invites);
      } catch (e) {
        console.error('Einladungen laden fehlgeschlagen', e);
      }
    }

    function renderInvites(invites) {
      const container = document.getElementById('invites-container');
      if (!invites || invites.length === 0) {
        container.innerHTML = '<p style="color:#666;font-size:0.85rem;text-align:center;">Keine offenen Einladungen</p>';
      } else {
        container.innerHTML = invites.map(inv => `
          <div class="invite-item">
            <span>💬 ${maskCode(inv.from)}</span>
            <button onclick="acceptInvite('${inv.from}', '${inv.room}')">Beitreten</button>
          </div>
        `).join('');
      }
    }

    async function sendInvite() {
      if (!myCode) { alert('Eigener Code fehlt.'); return; }
      partnerCode = document.getElementById('partnerCodeInput').value.trim();
      if (partnerCode.length !== 6) { alert('Code muss 6‑stellig sein.'); return; }
      if (partnerCode === myCode) { alert('Chat mit dir selbst nicht möglich.'); return; }

      const room = [myCode, partnerCode].sort().join('-');
      try {
        const res = await fetch(`${API_BASE}/invites/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from: myCode, to: partnerCode })
        });
        if (!res.ok) throw new Error('Fehler beim Senden');
        chatRoom = room;
        openChat();
      } catch (e) {
        alert('Einladung konnte nicht gesendet werden.');
      }
    }

    async function acceptInvite(fromCode, room) {
      partnerCode = fromCode;
      chatRoom = room;
      // Einladung vom Server löschen
      await fetch(`${API_BASE}/invites/${myCode}/${fromCode}`, { method: 'DELETE' });
      openChat();
    }

    // ── WebRTC / PeerJS ──────────────────────────────────────────────────
    function setupPeer() {
      if (peer) {
        peer.destroy();
        peer = null;
      }
      // Peer-ID = chatRoom + myCode (sicher eindeutig)
      const peerId = chatRoom + '-' + myCode;
      peer = new Peer(peerId, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 0
      });

      peer.on('open', (id) => {
        console.log('PeerID:', id);
        // Verbindung zum Partner aufbauen, wenn ich der "Initiator" bin (höherer Code)
        if (myCode > partnerCode) {
          connectToPartner();
        }
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        conn.on('open', () => {
          updateConnectionStatus(true);
          conn.on('data', handleRemoteData);
        });
        conn.on('close', () => updateConnectionStatus(false));
        conn.on('error', () => updateConnectionStatus(false));
      });

      peer.on('error', (err) => {
        console.error('Peer-Fehler:', err);
        updateConnectionStatus(false);
      });
    }

    function connectToPartner() {
      const partnerPeerId = chatRoom + '-' + partnerCode;
      console.log('Verbinde zu:', partnerPeerId);
      conn = peer.connect(partnerPeerId, { reliable: true });
      conn.on('open', () => {
        updateConnectionStatus(true);
        conn.on('data', handleRemoteData);
      });
      conn.on('close', () => updateConnectionStatus(false));
      conn.on('error', () => updateConnectionStatus(false));
    }

    function handleRemoteData(data) {
      if (data.type === 'chat_message') {
        const msgs = getMessages();
        msgs.push({
          from: partnerCode,
          fromName: data.fromName || maskCode(partnerCode),
          text: data.text,
          ts: data.ts
        });
        saveMessages(msgs);
        renderMessages();
      }
    }

    function updateConnectionStatus(connected) {
      const dot = document.getElementById('connection-dot');
      const label = document.getElementById('connection-label');
      if (connected) {
        dot.className = 'status-dot connected';
        label.textContent = 'Verbunden (P2P)';
      } else {
        dot.className = 'status-dot disconnected';
        label.textContent = 'Nicht verbunden';
      }
    }

    // ── Nachrichten ───────────────────────────────────────────────────────
    function getMessages() {
      if (!chatRoom) return [];
      return JSON.parse(localStorage.getItem(MSG_PREFIX + chatRoom) || '[]');
    }
    function saveMessages(msgs) {
      localStorage.setItem(MSG_PREFIX + chatRoom, JSON.stringify(msgs));
    }
    function renderMessages() {
      const msgs = getMessages();
      const container = document.getElementById('messages');
      container.innerHTML = msgs.map(m => {
        const isMine = m.from === myCode;
        return `
          <div class="msg-bubble ${isMine ? 'mine' : 'other'}">
            <span class="msg-author">${isMine ? 'Du' : (m.fromName || maskCode(m.from))}</span>
            ${escHtml(m.text)}
            <div class="msg-time">${new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</div>
          </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const msg = {
        from: myCode,
        fromName: localStorage.getItem('sm_name') || myCode,
        text,
        ts: Date.now()
      };

      // Lokal speichern
      const msgs = getMessages();
      msgs.push(msg);
      saveMessages(msgs);
      renderMessages();

      // Per WebRTC senden
      if (conn && conn.open) {
        conn.send({ type: 'chat_message', ...msg });
      } else {
        console.warn('Nicht verbunden, Nachricht nur lokal gespeichert');
      }

      input.value = '';
    }

    // ── UI ───────────────────────────────────────────────────────────────
    function openChat() {
      document.getElementById('setup-area').classList.add('hidden');
      document.getElementById('chat-area').classList.add('active');
      document.getElementById('roomInfo').textContent = 'Raum: ' + chatRoom;
      setupPeer();
      renderMessages();
      document.getElementById('msgInput').focus();
    }

    function resetToSetup() {
      if (conn) { conn.close(); conn = null; }
      if (peer) { peer.destroy(); peer = null; }
      chatRoom = '';
      partnerCode = '';
      document.getElementById('setup-area').classList.remove('hidden');
      document.getElementById('chat-area').classList.remove('active');
      document.getElementById('partnerCodeInput').value = '';
      document.getElementById('roomInfo').textContent = '';
      loadInvites();
    }

    // ── Polling ──────────────────────────────────────────────────────────
    function startInvitePolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadInvites, 3000);
    }

    // ── Helfer ──────────────────────────────────────────────────────────
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }
    function maskCode(c) { return c ? c.slice(0,3) + '…' : '???'; }

    document.addEventListener('DOMContentLoaded', init);
    document.getElementById('msgInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
