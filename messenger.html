<!DOCTYPE html>
<html lang="de">
<head>

  <!-- Eruda – Mobile Console (nur für Debugging) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotMe · Messenger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060a0f">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Messenger-spezifische Ergänzungen */
    .chat-card { cursor: pointer; }
    .unread-badge {
      background: var(--p3);
      color: white;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-left: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-dim);
    }
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      display: flex;
      margin-bottom: 8px;
    }
    .msg-i { justify-content: flex-start; }
    .msg-o { justify-content: flex-end; }
    .bubble {
      max-width: 75%;
      background: var(--bg2);
      padding: 12px 14px;
      border-radius: 20px;
      border-top-left-radius: 4px;
      border: 1px solid var(--bord);
    }
    .msg-o .bubble {
      background: var(--acc);
      color: var(--bg);
      border: none;
      border-top-right-radius: 4px;
      border-top-left-radius: 20px;
    }
    .btxt { word-break: break-word; }
    .btime {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: right;
    }
    .msg-o .btime { color: rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<!-- LOCAL‑MODE BANNER -->
<div id="local-mode-banner" class="local-banner" style="display: none;">
  <span>📴</span>
  <span>Lokaler Modus – Nachrichten werden gespeichert und später gesendet</span>
</div>

<!-- SCREEN 1 – HOME (Kontaktliste) -->
<div id="s-home" class="screen active">
  <header class="app-header">
    <div class="header-left"></div>
    <div class="logo">SPOT<b>ME</b></div>
    <div class="header-right">
      <div class="status-badge" id="header-status">● ONLINE</div>
    </div>
  </header>

  <div class="home-content">
    <!-- Eigener Code -->
    <div class="code-card-new">
      <div class="code-label">Dein Code</div>
      <div class="code-value" id="mycode">--- ---</div>
      <div class="code-actions">
        <button class="csbtn-new" onclick="copyCode()">📋 Kopieren</button>
        <button class="csbtn-new csbtn-primary" onclick="shareCode()">↗️ Teilen</button>
      </div>
    </div>

    <!-- Kontaktliste -->
    <div id="psec">
      <div class="section-header">
        <span class="section-label">Chats</span>
        <button class="missed-clear-btn" onclick="refreshChatList()">↻</button>
      </div>
      <div id="plist" class="contact-list"></div>
    </div>

    <!-- Neue Nachricht -->
    <div class="conn-box-new">
      <div class="conn-label">Neue Nachricht</div>
      <div class="drow-new">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="dinp-new" maxlength="1" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn-main-new" id="cbtn" onclick="openNewMessage()" disabled>✉️ Nachricht verfassen</button>
    </div>
  </div>
</div>

<!-- SCREEN 2 – CHAT -->
<div id="s-chat" class="screen">
  <div class="chat-bar">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="peer-wrap">
      <div class="pav" id="pav">🧑</div>
      <div class="pinfo">
        <div class="pname" id="pname">...</div>
        <div class="pstatus dim" id="pstatus">○ Nachricht senden</div>
      </div>
    </div>
    <button class="menu-btn" onclick="clearCurrentChat()">🗑️</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-chat" id="ehint">
      <div class="empty-icon">💬</div>
      <div class="empty-txt">Noch keine Nachrichten</div>
    </div>
  </div>

  <div class="icont">
    <div class="ibar">
      <textarea class="minp" id="minp" placeholder="Nachricht..." rows="1" oninput="autoH(this)" onkeydown="hkey(event)"></textarea>
      <button class="send-btn" id="sbtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>
</div>

<!-- Info Modal -->
<div id="info-modal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:320px; text-align:center;">
    <h3 id="info-modal-title"></h3>
    <p id="info-modal-message" style="margin:16px 0; color:var(--text-dim);"></p>
    <button id="info-modal-ok" class="btn-primary" style="width:100%;">OK</button>
  </div>
</div>

<!-- In-App Notification -->
<div class="in-notif" id="in-notif" onclick="switchToChatFromNotif()">
  <div class="in-ico">💬</div>
  <div><div class="in-from" id="in-from">...</div><div class="in-msg" id="in-msg">...</div></div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// Konfiguration & Globale Variablen
// ─────────────────────────────────────────────────────────────────────────────
const API_BASE = 'https://spotme-pg-test.onrender.com/api';
let myCode = localStorage.getItem('sm_code');
if (!myCode) {
  myCode = Math.floor(100000 + Math.random() * 900000).toString();
  localStorage.setItem('sm_code', myCode);
}
const myToken = localStorage.getItem('sm_token') || '';
let currentPartnerCode = '';
let currentPartnerName = '';

// ─────────────────────────────────────────────────────────────────────────────
// Hilfsfunktionen
// ─────────────────────────────────────────────────────────────────────────────
function toast(msg, ms = 2400) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, ms);
}

function showInfoModal(title, message, buttonText = 'OK') {
  let modal = document.getElementById('info-modal');
  if (!modal) return;
  document.getElementById('info-modal-title').textContent = title;
  document.getElementById('info-modal-message').textContent = message;
  document.getElementById('info-modal-ok').textContent = buttonText;
  modal.style.display = 'flex';
  const close = () => modal.style.display = 'none';
  document.getElementById('info-modal-ok').onclick = close;
  modal.onclick = (e) => { if (e.target === modal) close(); };
}

function formatCode(c) { return c.slice(0,3) + ' · ' + c.slice(3,6); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─────────────────────────────────────────────────────────────────────────────
// Code-Eingabe
// ─────────────────────────────────────────────────────────────────────────────
function initDigits() {
  const inps = document.querySelectorAll('.dinp-new');
  inps.forEach((p, i) => {
    p.addEventListener('input', () => {
      const v = p.value.replace(/\D/g, '');
      p.value = v ? v.slice(-1) : '';
      p.classList.toggle('filled', !!p.value);
      if (p.value && i < 5) inps[i + 1].focus();
      document.getElementById('cbtn').disabled = getDigits().length !== 6;
    });
    p.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !p.value && i > 0) {
        inps[i - 1].value = ''; inps[i - 1].classList.remove('filled');
        inps[i - 1].focus(); document.getElementById('cbtn').disabled = true;
      }
    });
    p.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      txt.split('').forEach((ch, j) => {
        if (inps[i + j]) { inps[i + j].value = ch; inps[i + j].classList.add('filled'); }
      });
      inps[Math.min(i + txt.length, 5)].focus();
      document.getElementById('cbtn').disabled = getDigits().length !== 6;
    });
  });
}
function getDigits() { return [...document.querySelectorAll('.dinp-new')].map(x => x.value).join(''); }

// ─────────────────────────────────────────────────────────────────────────────
// Code kopieren / teilen
// ─────────────────────────────────────────────────────────────────────────────
function copyCode() {
  navigator.clipboard.writeText(myCode).then(() => toast('✅ Code kopiert')).catch(() => toast('Code: ' + myCode));
}
function shareCode() {
  const url = `${window.location.origin}${window.location.pathname}?code=${myCode}`;
  if (navigator.share) navigator.share({ title: 'SpotMe', text: `Mein Code: ${formatCode(myCode)}`, url });
  else copyCode();
}

// ─────────────────────────────────────────────────────────────────────────────
// Kontaktliste rendern
// ─────────────────────────────────────────────────────────────────────────────
async function refreshChatList() {
  const lst = document.getElementById('plist');
  if (!lst) return;
  
  const idx = JSON.parse(localStorage.getItem('sm_idx') || '[]');
  let unreadCounts = {};
  
  if (myToken) {
    try {
      const res = await fetch(`${API_BASE}/offline-messages/${myCode}?token=${myToken}`);
      if (res.ok) {
        const msgs = await res.json();
        msgs.filter(m => !m.read).forEach(m => {
          unreadCounts[m.senderCode] = (unreadCounts[m.senderCode] || 0) + 1;
        });
      }
    } catch (e) {}
  }
  
  const contacts = [];
  const seen = new Set();
  
  idx.forEach(c => {
    if (!seen.has(c.code)) {
      seen.add(c.code);
      contacts.push({
        code: c.code,
        name: c.partner || formatCode(c.code),
        preview: c.preview || '—',
        ts: c.ts,
        unread: unreadCounts[c.code] || 0
      });
    }
  });
  
  Object.keys(unreadCounts).forEach(code => {
    if (!seen.has(code)) {
      contacts.push({
        code: code,
        name: formatCode(code),
        preview: 'Neue Nachricht',
        ts: Date.now(),
        unread: unreadCounts[code]
      });
    }
  });
  
  contacts.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  
  if (contacts.length === 0) {
    lst.innerHTML = '<div class="empty-state">Noch keine Chats</div>';
    return;
  }
  
  lst.innerHTML = contacts.map(c => {
    const alias = c.name;
    const unreadBadge = c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : '';
    const timeStr = c.ts ? new Date(c.ts).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }) : '';
    return `
      <div class="chat-card" onclick="openChatWith('${c.code}', '${esc(alias)}')">
        <div class="card-row">
          <div class="card-avatar">🧑</div>
          <div class="card-details">
            <div class="card-name">${esc(alias)} ${unreadBadge}</div>
            <div class="card-preview">${esc(c.preview || '—')}</div>
          </div>
        </div>
        <div class="card-meta">
          <span class="card-time">${timeStr}</span>
          <span class="card-code">${formatCode(c.code)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// Chat öffnen
// ─────────────────────────────────────────────────────────────────────────────
async function openChatWith(code, name) {
  currentPartnerCode = code;
  currentPartnerName = name || formatCode(code);
  
  document.getElementById('pname').textContent = currentPartnerName;
  document.getElementById('pav').textContent = currentPartnerName[0]?.toUpperCase() || '🧑';
  document.getElementById('sbtn').disabled = false;
  document.getElementById('minp').disabled = false;
  
  const messagesDiv = document.getElementById('messages');
  messagesDiv.innerHTML = '';
  
  // Lokale Nachrichten laden
  const chatId = 'sm_' + [myCode, code].sort().join('_');
  const localMsgs = JSON.parse(localStorage.getItem('smmsg_' + chatId) || '[]');
  
  // Offline-Nachrichten vom Server laden
  let serverMsgs = [];
  if (myToken) {
    try {
      const res = await fetch(`${API_BASE}/offline-messages/${myCode}?token=${myToken}`);
      if (res.ok) {
        const all = await res.json();
        serverMsgs = all.filter(m => m.senderCode === code || m.recipient === code);
        // Als gelesen markieren
        for (const m of serverMsgs.filter(m => !m.read && m.senderCode === code)) {
          await fetch(`${API_BASE}/offline-message/${m.id}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: myCode, token: myToken })
          });
        }
      }
    } catch (e) {}
  }
  
  // Nachrichten rendern
  const allMessages = [
    ...localMsgs.map(m => ({ ...m, type: 'local' })),
    ...serverMsgs.filter(m => m.senderCode === code).map(m => ({ text: m.message, ts: new Date(m.timestamp).getTime(), own: false, type: 'server' }))
  ].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  
  allMessages.forEach(m => {
    appendMessageToUI(m.text, m.own, m.ts);
  });
  
  if (allMessages.length === 0) {
    messagesDiv.innerHTML = '<div class="empty-chat"><div class="empty-icon">💬</div><div class="empty-txt">Noch keine Nachrichten</div></div>';
  }
  
  document.getElementById('s-home').classList.remove('active');
  document.getElementById('s-chat').classList.add('active');
  document.getElementById('minp').focus();
  
  refreshChatList();
}

function appendMessageToUI(text, own, ts) {
  const messagesDiv = document.getElementById('messages');
  const hint = document.getElementById('ehint');
  if (hint) hint.remove();
  
  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  
  const wrapper = document.createElement('div');
  wrapper.className = 'msg ' + (own ? 'msg-o' : 'msg-i');
  wrapper.innerHTML = `
    <div class="bubble">
      <div class="btxt">${esc(text)}</div>
      <div class="btime">${timeStr}${own ? ' ✓✓' : ''}</div>
    </div>
  `;
  messagesDiv.appendChild(wrapper);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// ─────────────────────────────────────────────────────────────────────────────
// Nachricht senden
// ─────────────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const inp = document.getElementById('minp');
  const text = inp.value.trim();
  if (!text || !currentPartnerCode) return;
  
  const ts = Date.now();
  appendMessageToUI(text, true, ts);
  inp.value = '';
  inp.style.height = 'auto';
  
  const chatId = 'sm_' + [myCode, currentPartnerCode].sort().join('_');
  
  // sm_idx aktualisieren
  const idx = JSON.parse(localStorage.getItem('sm_idx') || '[]');
  const existing = idx.find(c => c.code === currentPartnerCode);
  const entry = { id: chatId, partner: currentPartnerName, code: currentPartnerCode, ts: ts, preview: text };
  if (existing) Object.assign(existing, entry);
  else idx.unshift(entry);
  localStorage.setItem('sm_idx', JSON.stringify(idx.slice(0, 15)));
  
  // Lokaler Chat-Verlauf
  const localMsgs = JSON.parse(localStorage.getItem('smmsg_' + chatId) || '[]');
  localMsgs.push({ text, own: true, ts });
  localStorage.setItem('smmsg_' + chatId, JSON.stringify(localMsgs));
  
  // An Server senden
  if (myToken) {
    try {
      const res = await fetch(`${API_BASE}/offline-message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipient: currentPartnerCode,
          senderCode: myCode,
          senderName: localStorage.getItem('sm_name') || myCode,
          message: text
        })
      });
      if (res.ok) {
        toast('✅ Nachricht gesendet');
      } else if (res.status === 429) {
        toast('⏳ Bitte warte kurz');
      }
    } catch (e) {
      toast('📴 Offline – Nachricht gespeichert');
    }
  } else {
    toast('⚠️ Kein Token – Nachricht lokal gespeichert');
  }
  
  refreshChatList();
}

// ─────────────────────────────────────────────────────────────────────────────
// Neue Nachricht verfassen
// ─────────────────────────────────────────────────────────────────────────────
function openNewMessage() {
  const code = getDigits();
  if (code.length !== 6) return;
  if (code === myCode) { toast('⚠️ Das ist dein eigener Code'); return; }
  
  const contacts = JSON.parse(localStorage.getItem('sm_contacts') || '{}');
  const name = contacts[code] || formatCode(code);
  
  openChatWith(code, name);
  
  document.querySelectorAll('.dinp-new').forEach(d => { d.value = ''; d.classList.remove('filled'); });
  document.getElementById('cbtn').disabled = true;
}

// ─────────────────────────────────────────────────────────────────────────────
// Zurück zur Kontaktliste
// ─────────────────────────────────────────────────────────────────────────────
function goHome() {
  document.getElementById('s-chat').classList.remove('active');
  document.getElementById('s-home').classList.add('active');
  document.querySelectorAll('.dinp-new').forEach(d => { d.value = ''; d.classList.remove('filled'); });
  document.getElementById('cbtn').disabled = true;
  refreshChatList();
}

// ─────────────────────────────────────────────────────────────────────────────
// Chat löschen
// ─────────────────────────────────────────────────────────────────────────────
function clearCurrentChat() {
  if (!currentPartnerCode) return;
  const chatId = 'sm_' + [myCode, currentPartnerCode].sort().join('_');
  localStorage.removeItem('smmsg_' + chatId);
  const idx = JSON.parse(localStorage.getItem('sm_idx') || '[]');
  localStorage.setItem('sm_idx', JSON.stringify(idx.filter(c => c.code !== currentPartnerCode)));
  goHome();
  toast('🗑️ Chat gelöscht');
}

// ─────────────────────────────────────────────────────────────────────────────
// Hilfsfunktionen für UI
// ─────────────────────────────────────────────────────────────────────────────
function autoH(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function hkey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function switchToChatFromNotif() {
  document.getElementById('in-notif').classList.remove('show');
}

// ─────────────────────────────────────────────────────────────────────────────
// Initialisierung
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  document.getElementById('mycode').textContent = formatCode(myCode);
  initDigits();
  refreshChatList();
  
  const params = new URLSearchParams(window.location.search);
  const autoCode = params.get('code');
  if (autoCode && autoCode.length === 6) {
    const inps = document.querySelectorAll('.dinp-new');
    autoCode.split('').forEach((ch, i) => { if (inps[i]) { inps[i].value = ch; inps[i].classList.add('filled'); } });
    document.getElementById('cbtn').disabled = false;
    openNewMessage();
  }
  
  setInterval(() => {
    if (myToken) refreshChatList();
  }, 30000);
});
</script>
</body>
  </html>
