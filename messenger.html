<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpotMe – Lokaler Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Syne', 'DM Sans', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1a1a1a;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      margin-bottom: 0.25rem;
      color: #ff4f7b;
      font-weight: 800;
    }
    .info {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 1.25rem;
    }
    .section-title {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
      border: 1px solid #333;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: #ff4f7b; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4f7b;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e0456b; }
    button.secondary {
      background: #2a2a2a;
      color: #eee;
    }
    .invite-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .invite-row input { flex: 1; margin-bottom: 0; }
    .invite-row button { width: auto; padding: 0.75rem 1.2rem; }
    #invites-container {
      margin-bottom: 1rem;
    }
    .invite-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #222;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      margin-bottom: 0.4rem;
    }
    .invite-item span { font-weight: 600; }
    .invite-item button {
      width: auto;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
    }
    #chat-area { display: none; }
    #chat-area.active { display: block; }
    #setup-area { display: block; }
    #setup-area.hidden { display: none; }
    #messages {
      height: 50vh;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding: 0.5rem;
      background: #111;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.9rem;
      word-break: break-word;
      animation: pop 0.2s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg-bubble.mine {
      align-self: flex-end;
      background: #ff4f7b;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble.other {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
    }
    .msg-author {
      font-weight: 700;
      font-size: 0.7rem;
      display: block;
      margin-bottom: 0.2rem;
      opacity: 0.8;
    }
    .msg-time {
      font-size: 0.65rem;
      opacity: 0.5;
      margin-top: 0.2rem;
      text-align: right;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    .input-row input { flex: 1; margin-bottom: 0; }
    .input-row button { width: auto; padding: 0.75rem 1.25rem; }
    .return-btn {
      margin-top: 0.8rem;
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💬 Lokaler Messenger</h2>
    <p class="info">Kein Server · Nur dieses Gerät</p>

    <!-- Setup-Bereich mit Einladungen -->
    <div id="setup-area">
      <div class="section-title">📨 Einladungen an dich:</div>
      <div id="invites-container">
        <p style="color:#666;font-size:0.85rem;text-align:center;">Keine offenen Einladungen</p>
      </div>
      
      <div class="section-title" style="margin-top:1rem;">Neuen Chat starten:</div>
      <div class="invite-row">
        <input type="text" id="partnerCodeInput" maxlength="6" placeholder="6‑stelliger Code">
        <button onclick="inviteAndStartChat()">💬 Einladen</button>
      </div>
    </div>

    <!-- Chat-Bereich -->
    <div id="chat-area">
      <p class="info" id="roomInfo"></p>
      <div id="messages"></div>
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="Nachricht..." autofocus>
        <button onclick="sendLocalMsg()">➤</button>
      </div>
      <button class="return-btn" onclick="resetToSetup()">← Zurück zu Einladungen</button>
    </div>
  </div>

  <script>
    const MSG_PREFIX = 'sm_local_msg_';
    const INVITE_KEY = 'sm_local_invites';
    let localMyCode = null;
    let localChatRoom = null;
    let localPartnerCode = null;
    let bc = null;
    let pollTimer = null;

    // Initialisierung
    function init() {
      localMyCode = localStorage.getItem('sm_code');
      if (!localMyCode) {
        document.querySelector('.info').textContent = '⚠️ Kein Code gefunden – bitte im Spot veröffentlichen';
      }
      // Partner aus URL?
      const params = new URLSearchParams(location.search);
      const partnerFromUrl = params.get('partner');
      if (partnerFromUrl && partnerFromUrl.length === 6 && localMyCode) {
        document.getElementById('partnerCodeInput').value = partnerFromUrl;
        // Automatisch Einladung starten
        setTimeout(() => inviteAndStartChat(), 300);
      }
      renderInvites();
      startInvitePolling();
    }

    // ── Einladungen ──────────────────────────────────────────────────────
    function getInvites() {
      return JSON.parse(localStorage.getItem(INVITE_KEY) || '[]');
    }

    function saveInvites(invites) {
      localStorage.setItem(INVITE_KEY, JSON.stringify(invites));
    }

    function getMyInvites() {
      if (!localMyCode) return [];
      return getInvites().filter(i => i.to === localMyCode);
    }

    function addInvite(from, to) {
      const invites = getInvites();
      if (!invites.find(i => i.from === from && i.to === to)) {
        invites.push({ from, to, ts: Date.now() });
        saveInvites(invites);
      }
    }

    function removeInvite(from, to) {
      let invites = getInvites();
      invites = invites.filter(i => !(i.from === from && i.to === to));
      saveInvites(invites);
    }

    function renderInvites() {
      const container = document.getElementById('invites-container');
      const invites = getMyInvites();
      if (invites.length === 0) {
        container.innerHTML = '<p style="color:#666;font-size:0.85rem;text-align:center;">Keine offenen Einladungen</p>';
      } else {
        container.innerHTML = invites.map(inv => `
          <div class="invite-item">
            <span>💬 ${maskCode(inv.from)}</span>
            <button onclick="acceptInvite('${inv.from}')">Beitreten</button>
          </div>
        `).join('');
      }
    }

    function acceptInvite(fromCode) {
      localPartnerCode = fromCode;
      const codes = [localMyCode, fromCode].sort();
      localChatRoom = codes[0] + '-' + codes[1];
      removeInvite(fromCode, localMyCode);
      openChat();
    }

    // ── Einladung senden & Chat starten ──────────────────────────────────
    function inviteAndStartChat() {
      if (!localMyCode) { alert('Dein Code fehlt. Bitte Profil veröffentlichen.'); return; }
      const partnerCode = document.getElementById('partnerCodeInput').value.trim();
      if (partnerCode.length !== 6) { alert('Code muss 6‑stellig sein.'); return; }
      if (partnerCode === localMyCode) { alert('Chat mit dir selbst ist nicht möglich.'); return; }

      localPartnerCode = partnerCode;
      const codes = [localMyCode, partnerCode].sort();
      localChatRoom = codes[0] + '-' + codes[1];

      addInvite(localMyCode, partnerCode);

      // Erste Nachricht
      const msgs = getMessages();
      msgs.push({
        from: localMyCode,
        fromName: localStorage.getItem('sm_name') || localMyCode,
        text: '👋 Hallo! Ich möchte chatten.',
        ts: Date.now(),
        isInvite: true
      });
      saveMessages(msgs);

      openChat();
      if (bc) bc.postMessage({ type: 'new_local_msg' });
    }

    // ── Nachrichten verwalten ───────────────────────────────────────────
    function getMessages() {
      if (!localChatRoom) return [];
      return JSON.parse(localStorage.getItem(MSG_PREFIX + localChatRoom) || '[]');
    }

    function saveMessages(msgs) {
      localStorage.setItem(MSG_PREFIX + localChatRoom, JSON.stringify(msgs));
    }

    function renderMessages() {
      const msgs = getMessages();
      const container = document.getElementById('messages');
      container.innerHTML = msgs.map(m => {
        const isMine = m.from === localMyCode;
        return `
          <div class="msg-bubble ${isMine ? 'mine' : 'other'}">
            <span class="msg-author">${isMine ? 'Du' : (m.fromName || maskCode(m.from))}</span>
            ${escHtml(m.text)}
            <div class="msg-time">${new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</div>
          </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function sendLocalMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      const msgs = getMessages();
      msgs.push({
        from: localMyCode,
        fromName: localStorage.getItem('sm_name') || localMyCode,
        text,
        ts: Date.now()
      });
      saveMessages(msgs);
      input.value = '';
      renderMessages();
      if (bc) bc.postMessage({ type: 'new_local_msg' });
      // Einladung aktuell halten
      if (localPartnerCode) addInvite(localMyCode, localPartnerCode);
    }

    // ── Chat öffnen / schließen ─────────────────────────────────────────
    function openChat() {
      document.getElementById('setup-area').classList.add('hidden');
      document.getElementById('chat-area').classList.add('active');
      document.getElementById('roomInfo').textContent = 'Raum: ' + localChatRoom;
      // Broadcast Channel
      if (bc) bc.close();
      bc = new BroadcastChannel(localChatRoom);
      bc.onmessage = (e) => {
        if (e.data && e.data.type === 'new_local_msg') renderMessages();
        if (e.data && e.data.type === 'invite_update') renderInvites();
      };
      renderMessages();
      document.getElementById('msgInput').focus();
    }

    function resetToSetup() {
      if (bc) bc.close();
      bc = null;
      localChatRoom = null;
      localPartnerCode = null;
      document.getElementById('setup-area').classList.remove('hidden');
      document.getElementById('chat-area').classList.remove('active');
      document.getElementById('partnerCodeInput').value = '';
      document.getElementById('roomInfo').textContent = '';
      renderInvites();
    }

    // ── Polling (falls kein Broadcast Channel möglich) ────────────────────
    function startInvitePolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(renderInvites, 2000);
    }

    // ── Helfer ──────────────────────────────────────────────────────────
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function maskCode(c) {
      return c ? c.slice(0,3) + '…' : '???';
    }

    // Enter-Taste im Nachrichtenfeld
    document.addEventListener('DOMContentLoaded', () => {
      init();
      document.getElementById('msgInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendLocalMsg();
      });
    });
  </script>
</body>
</html>
