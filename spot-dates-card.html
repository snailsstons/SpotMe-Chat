    <style>
        :root {
            --spot-acc: #ff4f7b;
            --spot-acc2: #ff9a00;
            --spot-acc-dim: rgba(255, 79, 123, 0.12);
            --spot-acc-border: rgba(255, 79, 123, 0.25);
            --acc: var(--spot-acc);
            --acc-dim: var(--spot-acc-dim);
            --p2: var(--spot-acc2);
        }
        .status-badge {
            color: var(--spot-acc);
            background: var(--spot-acc-dim);
            border-color: var(--spot-acc-border);
        }
        .nav-btn.active {
            color: var(--spot-acc);
            background: var(--spot-acc-dim);
        }
    </style>

<body>

<header class="app-header">
  <div class="header-left">
    <button class="back-btn" onclick="goHome()" title="Zurück zum Chat">‹</button>
  </div>
  <div class="logo">
    SPOT<b>ME</b>
    <span style="font-weight:300; opacity:0.5; font-size:0.8rem;">Dates</span>
  </div>

  <div class="header-right">
  <span class="header-online-dot" id="header-online-dot" title="Online-Status">⚫</span>
  <button class="refresh-btn" id="my-profile-btn" onclick="showMyProfile()" title="Mein Profil">👤</button>
  <button class="refresh-btn" id="refresh-btn" onclick="refreshSpot()" title="Aktualisieren">↺</button>
<!--  <div class="status-badge" id="status-indicator">● CARDS</div> -->
  </div>

</header>

  <!-- 🆕 Card-Ansicht (renderList() schreibt hier rein) -->
  <div id="community-list"></div>
</div>

<!-- 🆕 Profilbar jetzt UNTER der Community-Liste -->
<div class="profile-bar" id="profile-bar" style="display:none;">
  <div class="profile-avatar" id="my-avatar-small">🧑</div>
  <div class="profile-info">
    <div class="profile-name" id="my-name-small">—</div>
    <div class="profile-meta" id="my-meta-small">—</div>
  </div>
  <div class="profile-actions">
    <button class="icon-btn" id="publish-toggle-small" onclick="togglePublish()" title="Sichtbarkeit">👁️</button>
    <button class="icon-btn" onclick="window.location.href='profil-dates.html?spot=' + SPOT" title="Profil bearbeiten">✎</button>
    <button class="icon-btn" id="location-toggle-small" onclick="toggleLocationSharing()" title="Standort teilen">📍</button>
  </div>
</div>

<!-- Kurznachricht Modal (wie in spot-dates.html) -->
<div class="modal-overlay" id="kurznachricht-modal" onclick="if(event.target===this) closeKurznachrichtModal()">
  <div class="modal-content" style="max-width:340px;" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeKurznachrichtModal()">✕</button>
    <div style="font-size:1.5rem;text-align:center;margin-bottom:0.5rem;">✉️</div>
    <h3 style="font-family:'Syne';text-align:center;margin-bottom:0.25rem;color:var(--acc);" id="kurznachr-name"></h3>
    <p style="font-size:0.85rem;color:var(--muted2);text-align:center;margin-bottom:1rem;">Kurznachricht hinterlassen</p>
    <textarea id="kurznachr-input" class="minp"
      placeholder="Deine Nachricht..."
      rows="4" maxlength="280"
      oninput="document.getElementById('kurznachr-chars').textContent=280-this.value.length"
      style="width:100%;margin-bottom:0.4rem;"></textarea>
    <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
      <span style="font-size:0.75rem;color:var(--muted2);">Max. 280 Zeichen</span>
      <span id="kurznachr-chars" style="font-size:0.75rem;color:var(--acc);font-weight:700;">280</span>
    </div>
    <button id="kurznachr-btn" onclick="submitKurznachricht()"
      style="width:100%;padding:0.9rem;background:var(--acc);color:var(--bg);
             border:none;border-radius:14px;font-size:1rem;font-weight:700;
             cursor:pointer;margin-bottom:0.6rem;">
      📨 Senden
    </button>
    <button onclick="closeKurznachrichtModal()"
      style="width:100%;padding:0.75rem;background:transparent;color:var(--muted2);
             border:1px solid var(--bord);border-radius:14px;font-size:0.9rem;cursor:pointer;">
      Abbrechen
    </button>
  </div>
</div>

<nav>
  <button class="nav-btn active">💕 CARDS</button>
  <button class="nav-btn" onclick="location.href='index.html'">💬 CHAT</button>
  <button class="nav-btn" onclick="location.href='profil-dates.html?spot=' + SPOT">👤 PROFIL</button>
</nav>

<div class="toast" id="toast"></div>

</body>
